<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Lullaby</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#0E0B1A;color:#EDE8FA;min-height:100vh;font-family:system-ui,sans-serif;overflow-x:hidden}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse at 20% 20%,rgba(124,58,237,.12),transparent 50%),radial-gradient(ellipse at 80% 80%,rgba(236,72,153,.07),transparent 50%);pointer-events:none;z-index:0}

/* SCREENS */
.screen{min-height:100vh;width:100%;position:relative;z-index:1}
#screen-landing{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 20px;text-align:center}
#screen-app{display:none;flex-direction:column}

/* LANDING */
.logo{width:72px;height:72px;border-radius:22px;background:linear-gradient(135deg,#6D28D9,#A855F7,#EC4899);display:flex;align-items:center;justify-content:center;font-size:34px;margin:0 auto 16px;box-shadow:0 8px 32px rgba(124,58,237,.4)}
h1{font-size:36px;font-weight:700;color:#F5EEFF;letter-spacing:-.02em;margin-bottom:6px}
.sub{font-size:12px;color:#8875B0;margin-bottom:28px;line-height:1.6;max-width:260px}
.cards{display:flex;flex-direction:column;gap:10px;width:100%;max-width:320px}
.card-btn{padding:18px;border-radius:18px;border:2px solid rgba(255,255,255,.15);background:rgba(255,255,255,.06);display:flex;align-items:center;gap:14px;text-align:left;cursor:pointer;width:100%;font-family:system-ui,sans-serif;-webkit-appearance:none;appearance:none}
.card-btn:active{opacity:.7;transform:scale(.97)}
.card-icon{font-size:32px;flex-shrink:0}
.card-title{font-size:15px;font-weight:600;color:#F5EEFF;display:block;margin-bottom:2px}
.card-desc{font-size:10px;color:#8875B0;display:block;line-height:1.4}

/* APP HEADER */
#hdr{padding:16px 18px 12px;background:rgba(14,11,26,.98);border-bottom:1px solid rgba(255,255,255,.06)}
.hdr-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.mode-pill{padding:5px 11px;border-radius:18px;font-size:11px;font-weight:600;border:none;cursor:pointer}
.mode-pill.baby{background:rgba(129,199,132,.15);color:#86EFAC}
.mode-pill.ttc{background:rgba(244,114,182,.15);color:#F472B6}
.mode-pill.preg{background:rgba(167,139,250,.15);color:#C4B5FD}
.settings-btn{width:34px;height:34px;border-radius:10px;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.05);color:#9070C0;font-size:14px;cursor:pointer}
.brand-center{text-align:center;margin-bottom:10px}
.brand-name{font-size:26px;font-weight:700;color:#F5EEFF}
.brand-sub{font-size:10px;color:#9070C0;cursor:pointer}
#stats-bar{display:flex;justify-content:center;flex-wrap:wrap}
.stat{text-align:center;padding:3px 10px;border-right:1px solid rgba(255,255,255,.07)}
.stat:last-child{border-right:none}
.sv{font-size:12px;font-weight:500;color:#D4C0F5}
.sl{font-size:8px;color:#7A6AAA;text-transform:uppercase;letter-spacing:.06em;margin-top:1px}

/* NAV */
#nav{display:flex;overflow-x:auto;border-bottom:1px solid rgba(255,255,255,.06);background:rgba(14,11,26,.97);position:sticky;top:0;z-index:100;scrollbar-width:none}
#nav::-webkit-scrollbar{display:none}
.nav-btn{flex-shrink:0;padding:11px 13px;border:none;background:transparent;color:#7A6AAA;font-size:11px;border-bottom:2px solid transparent;white-space:nowrap;font-weight:500;cursor:pointer;font-family:system-ui,sans-serif}
.nav-btn.active{color:#E0C8FF;border-bottom-color:#A066FF}

/* CONTENT */
#content{padding:14px 16px;position:relative;z-index:1;padding-bottom:80px}
.page{display:none}
.page.active{display:block}

/* COMMON UI */
.section-hd{font-size:10px;color:#9070C0;text-transform:uppercase;letter-spacing:.09em;margin:14px 0 7px;font-weight:600;display:flex;align-items:center;gap:6px}
.section-hd::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,rgba(160,102,255,.3),transparent)}
.info-box{padding:10px 13px;border-radius:11px;background:rgba(160,102,255,.05);border:1px solid rgba(160,102,255,.12);font-size:11px;color:#9B87BF;line-height:1.7;margin-bottom:8px}
.warn-box{padding:10px 13px;border-radius:11px;background:rgba(251,146,60,.09);border:1px solid rgba(251,146,60,.22);font-size:11px;color:#FDBA74;line-height:1.7;margin-bottom:8px}
.good-box{padding:10px 13px;border-radius:11px;background:rgba(134,239,172,.08);border:1px solid rgba(134,239,172,.2);font-size:11px;color:#86EFAC;line-height:1.7;margin-bottom:8px}
.panel{padding:12px 14px;border-radius:13px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.08);margin-bottom:8px}
.log-row{display:flex;justify-content:space-between;align-items:center;padding:9px 11px;border-radius:10px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.07);margin-bottom:4px}
.x-btn{background:none;border:none;color:#3D2E58;font-size:18px;padding:2px 4px;cursor:pointer;font-family:system-ui}
.tab-bar{display:flex;border-radius:11px;overflow:hidden;border:1px solid rgba(255,255,255,.08);margin-bottom:10px;background:rgba(255,255,255,.03)}
.tab-opt{flex:1;padding:9px 4px;border:none;background:transparent;color:#7A6AAA;font-size:11px;cursor:pointer;font-family:system-ui,sans-serif;font-weight:500}
.tab-opt.active{background:rgba(160,102,255,.18);color:#EDE8FA}
.log-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:8px}
.log-card{padding:13px 6px;border-radius:12px;border:1px solid rgba(255,255,255,.07);background:rgba(255,255,255,.04);display:flex;flex-direction:column;align-items:center;gap:5px;cursor:pointer;font-family:system-ui,sans-serif;color:#A090C8;font-size:12px}
.log-card:active{transform:scale(.96);background:rgba(255,255,255,.08)}
.log-card .ei{font-size:22px}
.rings{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:9px 0 11px}
.ring{text-align:center;padding:9px 2px;border-radius:12px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.07)}
.rv{font-size:17px;font-weight:500;color:#EDE8FA}
.rl{font-size:8px;color:#7A6AAA;text-transform:uppercase;margin-top:1px}
.ww-box{padding:14px;border-radius:15px;background:linear-gradient(135deg,rgba(109,40,217,.15),rgba(168,85,247,.08));border:1px solid rgba(160,102,255,.22);margin-bottom:11px}
.since-row{display:flex;gap:6px;margin-bottom:10px}
.since-chip{display:flex;flex-direction:column;align-items:center;padding:10px 5px;border-radius:12px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);flex:1;cursor:pointer}
.since-chip.urgent{border-color:rgba(248,113,113,.35);background:rgba(248,113,113,.07)}
.since-chip.late{border-color:rgba(251,146,60,.28);background:rgba(251,146,60,.07)}
.since-chip.ok{border-color:rgba(134,239,172,.22);background:rgba(134,239,172,.05)}
.tl{position:relative}
.tl-line{position:absolute;left:19px;top:0;bottom:0;width:1px;background:linear-gradient(180deg,rgba(160,102,255,.3),transparent)}
.tl-row{display:flex;align-items:flex-start;margin-bottom:5px}
.tl-dot-wrap{width:38px;flex-shrink:0;display:flex;justify-content:center}
.tl-dot{width:12px;height:12px;border-radius:50%;margin-top:12px;z-index:1;flex-shrink:0}
.tl-card{flex:1;padding:10px 12px;border-radius:10px;cursor:pointer;border:1px solid rgba(255,255,255,.06);border-left-width:3px;background:rgba(255,255,255,.03)}
.tl-label{font-size:12px;color:#EDE8FA;font-weight:500}
.tl-time{font-size:10px;color:#7A6AAA;margin-top:1px}
.tl-detail{font-size:11px;color:#9B87BF;line-height:1.6;display:none;margin-top:6px}
.tl-detail.open{display:block}
.chev{color:#7A6AAA;font-size:11px;transition:transform .2s;display:inline-block}
.chev.open{transform:rotate(180deg)}
.acc-wrap{border-radius:12px;border:1px solid rgba(255,255,255,.08);overflow:hidden;margin-bottom:6px}
.acc-head{padding:12px 14px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;background:rgba(255,255,255,.03)}
.acc-head.open{background:rgba(160,102,255,.09)}
.acc-body{padding:0 14px 12px;display:none;font-size:11px;color:#9B87BF;line-height:1.7;background:rgba(160,102,255,.04)}
.acc-body.open{display:block}
.cl-row{display:flex;align-items:flex-start;gap:9px;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.04)}
.cl-row:last-child{border-bottom:none}
.cl-check{width:19px;height:19px;border-radius:5px;border:1px solid rgba(160,102,255,.3);background:rgba(160,102,255,.07);flex-shrink:0;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:10px;color:#A066FF;margin-top:1px}
.cl-check.done{background:rgba(160,102,255,.35);border-color:rgba(160,102,255,.6)}
.chip-tag{display:inline-flex;padding:4px 9px;border-radius:7px;font-size:11px;margin:2px;border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.04);color:#8875B0;cursor:pointer}
.chip-tag.on{background:rgba(160,102,255,.18);border-color:rgba(160,102,255,.35);color:#D4C0F5}
.chip-tag.done{background:rgba(134,239,172,.09);border-color:rgba(134,239,172,.25);color:#86EFAC}
.primary-btn{padding:12px;border-radius:12px;border:none;background:linear-gradient(135deg,#7C3AED,#A855F7);color:#fff;font-size:14px;font-weight:500;width:100%;cursor:pointer;font-family:system-ui,sans-serif}
.primary-btn:active{opacity:.85}
.cycle-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin-bottom:8px}
.cy-day{aspect-ratio:1;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:500;background:rgba(255,255,255,.04);color:#7A6AAA;border:1px solid rgba(255,255,255,.05)}
.cy-day.today{border-color:rgba(160,102,255,.5);color:#C4B5FD}
.cy-day.period{background:rgba(244,114,182,.25);border-color:rgba(244,114,182,.4);color:#F9A8D4}
.cy-day.fertile{background:rgba(34,197,94,.15);border-color:rgba(34,197,94,.3);color:#86EFAC}
.cy-day.ov{background:rgba(251,191,36,.25);border-color:rgba(251,191,36,.4);color:#FDE68A}
.wk-hero{padding:18px;border-radius:16px;background:linear-gradient(135deg,rgba(167,139,250,.12),rgba(236,72,153,.07));border:1px solid rgba(167,139,250,.2);margin-bottom:11px}
.size-big{font-size:52px;text-align:center;margin:8px 0;line-height:1}
.prog-bar{height:5px;border-radius:3px;background:rgba(255,255,255,.06);overflow:hidden;margin:9px 0 3px}
.prog-fill{height:100%;border-radius:3px;background:linear-gradient(90deg,#7C3AED,#A855F7,#EC4899)}
.sf-card{border-radius:13px;border:1px solid rgba(255,255,255,.08);overflow:hidden;margin-bottom:6px}
.sf-head{padding:12px 14px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;background:rgba(255,255,255,.03)}
.sf-head.open{background:rgba(129,199,132,.07)}
.sf-body{padding:0 14px 12px;display:none;font-size:11px;color:#9B87BF;line-height:1.7;background:rgba(129,199,132,.03)}
.sf-body.open{display:block}
.prep-row{display:flex;gap:8px;padding:5px 0;border-bottom:1px solid rgba(255,255,255,.04)}
.prep-row:last-child{border-bottom:none}
.prep-num{width:18px;height:18px;border-radius:5px;background:rgba(129,199,132,.15);color:#86EFAC;font-size:9px;font-weight:600;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px}
.dose-box{padding:14px;border-radius:14px;background:rgba(99,102,241,.07);border:1px solid rgba(99,102,241,.18);margin-bottom:11px}
.dose-result{padding:12px 14px;border-radius:12px;background:rgba(99,102,241,.1);border:1px solid rgba(99,102,241,.25);margin-top:9px}
.dose-amount{font-size:26px;font-weight:600;color:#A5B4FC}

/* MODAL */
#modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:300;display:none;align-items:flex-end;justify-content:center;backdrop-filter:blur(8px)}
#modal-overlay.open{display:flex}
#modal-box{background:#1A1430;border-radius:20px 20px 0 0;padding:20px 20px 44px;width:100%;max-width:480px;border-top:1px solid rgba(255,255,255,.08);max-height:88vh;overflow-y:auto}
#modal-title{font-size:18px;font-weight:700;color:#F5EEFF;margin-bottom:14px}
.field{margin-bottom:10px}
.field label{font-size:10px;color:#8875B0;display:block;margin-bottom:3px;text-transform:uppercase;letter-spacing:.07em;font-weight:600}
.field input,.field select,.field textarea{width:100%;padding:9px 12px;border-radius:10px;font-size:13px;color:#EDE8FA;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);font-family:system-ui,sans-serif}
.field textarea{resize:vertical;min-height:50px}
.modal-btns{display:flex;gap:7px;margin-top:14px}
.btn-primary{flex:1;padding:12px;border-radius:12px;border:none;background:linear-gradient(135deg,#7C3AED,#A855F7);color:#fff;font-size:14px;font-weight:500;cursor:pointer;font-family:system-ui,sans-serif}
.btn-cancel{padding:12px 15px;border-radius:12px;border:1px solid rgba(255,255,255,.1);background:transparent;color:#8875B0;font-size:14px;cursor:pointer;font-family:system-ui,sans-serif}

/* CHAT */
.chat-wrap{display:flex;flex-direction:column;height:calc(100vh - 200px);min-height:340px}
.chat-msgs{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding-bottom:8px;scrollbar-width:none}
.chat-msgs::-webkit-scrollbar{display:none}
.chat-msg{max-width:86%;padding:10px 13px;border-radius:15px;font-size:12px;line-height:1.7}
.chat-msg.user{align-self:flex-end;background:linear-gradient(135deg,#6D28D9,#A855F7);color:#fff;border-radius:15px 15px 4px 15px}
.chat-msg.bot{align-self:flex-start;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);color:#C8B8E8;border-radius:15px 15px 15px 4px}
.chat-msg.bot strong{color:#EDE8FA}
.typing span{display:inline-block;animation:blink 1.4s infinite;color:#5A4878}
.typing span:nth-child(2){animation-delay:.2s}
.typing span:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:0}40%{opacity:1}}
.sq-list{display:flex;flex-wrap:wrap;gap:5px;padding:5px 0;flex-shrink:0}
.sq-btn{padding:6px 11px;border-radius:16px;border:1px solid rgba(160,102,255,.25);background:rgba(160,102,255,.07);color:#C4A8FF;font-size:11px;cursor:pointer;font-family:system-ui,sans-serif;text-align:left}
.chat-input-row{display:flex;gap:7px;align-items:flex-end;padding-top:8px;border-top:1px solid rgba(255,255,255,.07);flex-shrink:0}
.chat-input{flex:1;padding:9px 12px;border-radius:12px;font-size:12px;resize:none;min-height:40px;max-height:90px;line-height:1.4;background:rgba(255,255,255,.05);border:1px solid rgba(160,102,255,.25);color:#EDE8FA;font-family:system-ui,sans-serif}
.chat-go{width:40px;height:40px;border-radius:12px;border:none;background:linear-gradient(135deg,#7C3AED,#A855F7);color:#fff;font-size:16px;flex-shrink:0;cursor:pointer}
.chat-go:disabled{opacity:.4}
.bp-section{background:rgba(255,255,255,.03);border-radius:12px;border:1px solid rgba(255,255,255,.08);padding:12px;margin-bottom:8px}
.bp-q{font-size:12px;color:#EDE8FA;font-weight:500;margin-bottom:7px}
.bp-opts{display:flex;flex-wrap:wrap;gap:5px}
.bp-opt{padding:5px 11px;border-radius:8px;font-size:11px;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.04);color:#8875B0;cursor:pointer;font-family:system-ui,sans-serif}
.bp-opt.sel{background:rgba(160,102,255,.2);border-color:rgba(160,102,255,.4);color:#D4C0F5}
</style>
</head>
<body>

<!-- LANDING -->
<div id="screen-landing" class="screen">
  <div class="logo">🌙</div>
  <h1>Lullaby</h1>
  <p class="sub">Your complete companion from trying to conceive through baby's first year.</p>
  <div class="cards">
    <button class="card-btn" id="btn-ttc">
      <span class="card-icon">🌸</span>
      <span><span class="card-title">Trying to Conceive</span><span class="card-desc">Cycle tracking, fertile window, ovulation, pre-conception guidance</span></span>
    </button>
    <button class="card-btn" id="btn-preg">
      <span class="card-icon">🤰</span>
      <span><span class="card-title">Pregnant</span><span class="card-desc">Week-by-week, kick counter, contraction timer, birth plan</span></span>
    </button>
    <button class="card-btn" id="btn-baby">
      <span class="card-icon">🌙</span>
      <span><span class="card-title">We Have a Baby</span><span class="card-desc">Schedule, feeding, sleep, solids guide, medicine dosing</span></span>
    </button>
  </div>
</div>

<!-- APP -->
<div id="screen-app" class="screen">
  <div id="hdr">
    <div class="hdr-top">
      <button class="mode-pill" id="mode-pill">🌙 Baby</button>
      <button class="settings-btn" id="settings-btn">⚙️</button>
    </div>
    <div class="brand-center">
      <div class="brand-name">Lullaby</div>
      <div class="brand-sub" id="brand-sub">tap to personalize</div>
    </div>
    <div id="stats-bar"></div>
  </div>
  <div id="nav"></div>
  <div id="content"></div>
</div>

<!-- MODAL -->
<div id="modal-overlay">
  <div id="modal-box">
    <div id="modal-title">Log</div>
    <div id="modal-fields"></div>
    <div class="modal-btns">
      <button class="btn-cancel" id="modal-cancel">Cancel</button>
      <button class="btn-primary" id="modal-save">Save</button>
    </div>
  </div>
</div>

<script>
// ── DATA ──

function rHdr(){

  if(bs)bs.textContent=S.mode==='baby'?(S.babyName?`${S.babyName}'s Guide ✏️`:'Tap to personalize ✏️'):S.mode==='preg'?(S.pregName||'Set your name ✏️'):( S.ttcName||'Set your name ✏️');

  let stats=[];
  if(S.mode==='ttc')stats=[{l:'Cycle Day',v:cycDay()||'—'},{l:'Cycle',v:S.cycleLen+'d'},{l:'Ovulation',v:'Day '+ovDay()},{l:'Next Period',v:nextP()}];
  else if(S.mode==='preg'){const w=calcW();stats=[{l:'Week',v:w},{l:'Trimester',v:trimOf(w)},{l:'Days Left',v:daysL()},{l:'Due',v:S.pregDue||'Not set'}];}

}
function rNav(){
  const tabs=MODE_TABS[S.mode]||[];
  const nav=document.getElementById('nav');
  nav.innerHTML=tabs.map(t=>`<button class="nav-btn${S.tab===t?' active':''}" data-tab="${t}">${TAB_LABELS[t]||t}</button>`).join('');
  nav.querySelectorAll('.nav-btn').forEach(btn=>{
    btn.addEventListener('click',function(){S.tab=this.dataset.tab;S.exp=null;ra();});

  const content=document.getElementById('content');
  content.innerHTML=tabs.map(t=>`<div id="p-${t}" class="page${S.tab===t?' active':''}"></div>`).join('');
}

  else if(type==='temp'){const tf=+document.getElementById('m-tempf')?.value;if(tf)S.health.temps.unshift({id:uid(),f:tf,meth:document.getElementById('m-tmeth')?.value,time:e.time,date:e.date});}
  else if(type==='med')S.health.meds.unshift({id:uid(),med:document.getElementById('m-med')?.value,dose:document.getElementById('m-dose')?.value,reason:document.getElementById('m-reason')?.value,time:e.time,date:e.date});
  else if(type==='visit'){const lb=+document.getElementById('m-vlb')?.value||0;const oz=+document.getElementById('m-voz2')?.value||0;const kg=(lb||oz)?lbKg(lb,oz):null;if(kg)S.wtKg=kg;S.health.visits.unshift({id:uid(),vt:document.getElementById('m-vt')?.value,date:document.getElementById('m-vdate')?.value||tod(),weight:fwt(kg),note:e.note});}
  else if(type==='period'){const pd=document.getElementById('m-pdate')?.value;const dt=pd?new Date(pd):new Date();const label=dt.toLocaleDateString([],{month:'short',day:'numeric'});S.periods.push({id:uid(),iso:pd||new Date().toISOString().slice(0,10),days:+document.getElementById('m-pdays')?.value||S.periodLen,date:label,label:`Period started ${label}`});}
  else if(type==='bbt'){const t=+document.getElementById('m-bbtf')?.value;if(t)S.bbt.push({id:uid(),temp:t,time:e.time,date:e.date,note:e.note,label:`BBT ${t}°F`});}
  else if(type==='lh'){const res=document.getElementById('m-lhres')?.value;S.lh.push({id:uid(),result:res,time:e.time,date:e.date,label:`LH: ${res}`});}
  else if(type==='sym-ttc'){const cd=cycDay();const SYMS=['Cramps','Spotting','Bloating','Breast tenderness','Mood changes','Fatigue','Headache','Nausea','Increased discharge'];const sel=SYMS.filter(s=>document.querySelector(`[data-sym="${s}"]`)?.classList.contains('on'));S.symptoms.push({id:uid(),syms:sel,day:cd,date:e.date,time:e.time,label:sel.join(', ')});}
  else if(type==='appt'){const adate=document.getElementById('m-adate')?.value;S.appts.push({id:uid(),type:document.getElementById('m-atype')?.value||'Appointment',date:adate||tod(),time:document.getElementById('m-atime')?.value,note:e.note,upcoming:!!adate&&new Date(adate)>=new Date()});}
  else if(['feed','sleep','diaper','pump'].includes(type))S.logs.unshift(e);
  sv();closeM();ra();
}

// INIT
ld();
if(S.mode){
  document.getElementById('screen-landing').style.display='none';
  document.getElementById('screen-app').style.display='flex';
  ra();
}

// Landing buttons
document.getElementById('btn-ttc').addEventListener('click',()=>setMode('ttc'));
document.getElementById('btn-preg').addEventListener('click',()=>setMode('preg'));
document.getElementById('btn-baby').addEventListener('click',()=>setMode('baby'));

// Modal close + save
document.getElementById('modal-cancel').addEventListener('click',closeM);
document.getElementById('modal-save').addEventListener('click',saveM);
document.getElementById('modal-overlay').addEventListener('click',function(e){if(e.target===this)closeM();});

// Header buttons
document.getElementById('mode-pill').addEventListener('click',switchMode);
document.getElementById('settings-btn').addEventListener('click',()=>openM('settings'));
document.getElementById('brand-sub').addEventListener('click',()=>openM('settings'));
</script>
