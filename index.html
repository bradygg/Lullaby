<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>LittleBug</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:#FAF8F4;color:#3B3B3B;min-height:100vh;font-family:'Inter',sans-serif;overflow-x:hidden}
button{cursor:pointer;font-family:'Inter',sans-serif;transition:all .18s}
input,textarea,select{font-family:'Inter',sans-serif;color:#3B3B3B;background:#fff;border:1.5px solid #E8E0D8;outline:none}
input:focus,textarea:focus,select:focus{border-color:#A8C5A1}
input::placeholder,textarea::placeholder{color:#B8AFA8}
select option{background:#fff;color:#3B3B3B}

/* LANDING */
#landing{position:fixed;inset:0;z-index:500;background:#FAF8F4;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:28px 20px;text-align:center;overflow-y:auto}
#landing.hidden{display:none}
.land-logo{margin:0 auto 16px;animation:fl 4s ease-in-out infinite}
@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.land-title{font-family:'Nunito',sans-serif;font-size:38px;font-weight:800;letter-spacing:-.5px;margin-bottom:5px}
.land-sub{font-size:12px;color:#E79A7D;margin-bottom:28px;font-style:italic;font-family:'Nunito',sans-serif}
.land-cards{display:flex;flex-direction:column;gap:11px;width:100%;max-width:320px}
.mc{padding:16px 18px;border-radius:18px;border:2px solid #E8E0D8;background:#fff;display:flex;align-items:center;gap:14px;text-align:left;cursor:pointer;width:100%;box-shadow:0 2px 8px rgba(0,0,0,.06);touch-action:manipulation;font-family:'Inter',sans-serif}
.mc:active{opacity:.8;transform:scale(.98)}
.mc.ttc{border-color:#F4C7C2}.mc.preg{border-color:#D9C6E6}.mc.baby{border-color:#A8C5A1}
.mc-icon{font-size:30px;flex-shrink:0}
.mc-title{font-family:'Nunito',sans-serif;font-size:15px;font-weight:700;color:#3B3B3B;margin-bottom:2px}
.mc-sub{font-size:10px;color:#8E8A86;line-height:1.4}

/* APP */
#app{display:none;position:relative;z-index:1;padding-bottom:80px}
#app.on{display:block}

/* HEADER */
#hdr{padding:14px 16px 10px;background:#fff;border-bottom:1.5px solid #F0EBE3;position:sticky;top:0;z-index:100;box-shadow:0 1px 4px rgba(0,0,0,.05)}
.hdr-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.hdr-logo{display:flex;align-items:center;gap:8px;cursor:pointer}
.hdr-brand{font-family:'Nunito',sans-serif;font-size:20px;font-weight:800}
.mbadge{padding:4px 10px;border-radius:18px;font-size:11px;font-weight:700;border:none;cursor:pointer;font-family:'Nunito',sans-serif}
.mbadge.ttc{background:#FFF0EE;color:#E79A7D;border:1.5px solid #F4C7C2}
.mbadge.preg{background:#F5F0FF;color:#9B72CF;border:1.5px solid #D9C6E6}
.mbadge.baby{background:#F0F7EF;color:#5A7A55;border:1.5px solid #A8C5A1}
.icon-btn{width:34px;height:34px;border-radius:11px;border:1.5px solid #E8E0D8;background:#FAF8F4;color:#8E8A86;font-size:14px;display:flex;align-items:center;justify-content:center}
#stats-bar{display:flex;overflow-x:auto;scrollbar-width:none}
#stats-bar::-webkit-scrollbar{display:none}
.stat{flex-shrink:0;text-align:center;padding:3px 11px;border-right:1px solid #F0EBE3}
.stat:last-child{border-right:none}
.sv{font-size:12px;font-weight:600;color:#3B3B3B;font-family:'Nunito',sans-serif}
.sl{font-size:8px;color:#8E8A86;letter-spacing:.06em;text-transform:uppercase;margin-top:1px}

/* NAV */
#nav{display:flex;overflow-x:auto;border-bottom:1.5px solid #F0EBE3;background:#fff;position:sticky;top:0;z-index:99;scrollbar-width:none}
#nav::-webkit-scrollbar{display:none}
.nb{flex-shrink:0;padding:11px 13px;border:none;background:transparent;color:#8E8A86;font-size:11px;border-bottom:2.5px solid transparent;white-space:nowrap;font-weight:600;cursor:pointer;font-family:'Nunito',sans-serif;touch-action:manipulation}
.nb.active{color:#5A7A55;border-bottom-color:#A8C5A1}

/* CONTENT */
#content{padding:14px 16px}
.tp{display:none}.tp.active{display:block}

/* COMMON */
.shd{font-family:'Nunito',sans-serif;font-size:11px;font-weight:700;color:#8E8A86;text-transform:uppercase;letter-spacing:.08em;margin:14px 0 7px;display:flex;align-items:center;gap:6px}
.shd::after{content:'';flex:1;height:1.5px;background:#F0EBE3;border-radius:2px}
.intro{font-size:13px;color:#8E8A86;margin-bottom:10px;line-height:1.6}
.card{padding:13px 15px;border-radius:15px;background:#fff;border:1.5px solid #F0EBE3;margin-bottom:9px;box-shadow:0 1px 4px rgba(0,0,0,.04)}
.info-b{padding:11px 13px;border-radius:13px;background:#F0F7EF;border:1.5px solid #C8DEC5;font-size:12px;color:#4A6844;line-height:1.7;margin-bottom:9px}
.warn-b{padding:11px 13px;border-radius:13px;background:#FFF5F0;border:1.5px solid #F4C7C2;font-size:12px;color:#C4614A;line-height:1.7;margin-bottom:9px}
.good-b{padding:11px 13px;border-radius:13px;background:#F5F0FF;border:1.5px solid #D9C6E6;font-size:12px;color:#7A5CA8;line-height:1.7;margin-bottom:9px}
.tip-b{padding:11px 13px;border-radius:13px;background:#FFF8F4;border:1.5px solid #F4D4C2;font-size:12px;color:#B5622A;line-height:1.7;margin-bottom:9px}
.log-row{display:flex;justify-content:space-between;align-items:center;padding:9px 12px;border-radius:12px;background:#fff;border:1.5px solid #F0EBE3;margin-bottom:5px;box-shadow:0 1px 3px rgba(0,0,0,.03)}
.x-btn{background:none;border:none;color:#D0C8C0;font-size:18px;padding:2px 5px;cursor:pointer}
.tab-bar{display:flex;border-radius:12px;overflow:hidden;border:1.5px solid #E8E0D8;margin-bottom:11px;background:#FAF8F4}
.tbtn{flex:1;padding:9px 4px;border:none;background:transparent;color:#8E8A86;font-size:11px;cursor:pointer;font-weight:600;font-family:'Nunito',sans-serif}
.tbtn.active{background:#fff;color:#3B3B3B;box-shadow:0 1px 4px rgba(0,0,0,.08)}
.log-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:9px}
.log-card{padding:13px 6px;border-radius:14px;border:1.5px solid #F0EBE3;background:#fff;display:flex;flex-direction:column;align-items:center;gap:5px;cursor:pointer;font-family:'Nunito',sans-serif;color:#5C3D2E;font-size:12px;font-weight:600;box-shadow:0 1px 4px rgba(0,0,0,.04);touch-action:manipulation}
.log-card:active{transform:scale(.96);background:#FAF8F4}
.log-card .ei{font-size:24px}
.rings{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:9px 0 11px}
.ring{text-align:center;padding:9px 2px;border-radius:13px;background:#fff;border:1.5px solid #F0EBE3;box-shadow:0 1px 3px rgba(0,0,0,.03)}
.rv{font-size:17px;font-weight:700;color:#3B3B3B;font-family:'Nunito',sans-serif}
.rl{font-size:8px;color:#8E8A86;text-transform:uppercase;margin-top:2px;font-weight:600}
.prim-btn{padding:13px;border-radius:13px;border:none;background:linear-gradient(135deg,#A8C5A1,#7DAE76);color:#fff;font-size:14px;font-weight:700;width:100%;cursor:pointer;font-family:'Nunito',sans-serif;box-shadow:0 3px 10px rgba(125,174,118,.25);touch-action:manipulation}
.prim-btn:active{opacity:.9}
.acc{border-radius:13px;border:1.5px solid #F0EBE3;overflow:hidden;margin-bottom:7px;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.03)}
.acc-h{padding:12px 14px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;background:#fff;touch-action:manipulation}
.acc-h.open{background:#FAF8F4}
.acc-b{padding:0 14px 12px;display:none;font-size:12px;color:#6B6560;line-height:1.7;background:#FAF8F4}
.acc-b.open{display:block}
.chev{color:#B8AFA8;font-size:11px;transition:transform .2s}
.chev.open{transform:rotate(180deg)}
.cl-row{display:flex;align-items:flex-start;gap:9px;padding:8px 0;border-bottom:1.5px solid #F5F1EC}
.cl-row:last-child{border-bottom:none}
.cl-box{width:19px;height:19px;border-radius:6px;border:2px solid #D0C8C0;background:#fff;flex-shrink:0;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:10px;color:#fff;margin-top:1px;touch-action:manipulation}
.cl-box.done{background:#A8C5A1;border-color:#A8C5A1}
.chip{display:inline-flex;padding:4px 10px;border-radius:18px;font-size:11px;margin:2px;border:1.5px solid #E8E0D8;background:#FAF8F4;color:#6B6560;cursor:pointer;font-weight:500;touch-action:manipulation}
.chip.on{background:#F0F7EF;border-color:#A8C5A1;color:#4A6844;font-weight:600}
.chip.done{background:#F0F7EF;border-color:#A8C5A1;color:#4A6844}
.ww-hero{padding:14px;border-radius:16px;background:linear-gradient(135deg,#F0F7EF,#E8F4E7);border:1.5px solid #C8DEC5;margin-bottom:11px}
.since-row{display:flex;gap:6px;margin-bottom:10px}
.since-chip{display:flex;flex-direction:column;align-items:center;padding:10px 5px;border-radius:13px;background:#fff;border:1.5px solid #F0EBE3;flex:1;cursor:pointer;box-shadow:0 1px 4px rgba(0,0,0,.04);touch-action:manipulation}
.since-chip.urgent{border-color:#F4C7C2;background:#FFF5F3}
.since-chip.late{border-color:#F4D4A8;background:#FFFAF3}
.since-chip.ok{border-color:#C8DEC5;background:#F0F7EF}
.tl{position:relative}
.tl-line{position:absolute;left:19px;top:0;bottom:0;width:2px;background:linear-gradient(180deg,#A8C5A1,#F4C7C2)}
.tl-row{display:flex;align-items:flex-start;margin-bottom:5px}
.tl-dw{width:38px;flex-shrink:0;display:flex;justify-content:center}
.tl-dot{width:12px;height:12px;border-radius:50%;margin-top:12px;z-index:1;flex-shrink:0;box-shadow:0 0 0 3px #FAF8F4}
.tl-card{flex:1;padding:10px 12px;border-radius:12px;cursor:pointer;border:1.5px solid #F0EBE3;border-left-width:3px;background:#fff;touch-action:manipulation}
.tl-label{font-family:'Nunito',sans-serif;font-size:13px;color:#3B3B3B;font-weight:700}
.tl-time{font-size:10px;color:#8E8A86;margin-top:1px}
.tl-det{font-size:11px;color:#6B6560;line-height:1.6;display:none;margin-top:6px}
.tl-det.open{display:block}
.wk-hero{padding:17px;border-radius:16px;background:linear-gradient(135deg,#F5F0FF,#EDE4FA);border:1.5px solid #D9C6E6;margin-bottom:11px}
.size-big{font-size:54px;text-align:center;margin:8px 0;line-height:1}
.prog-bar{height:6px;border-radius:3px;background:#E8E0D8;overflow:hidden;margin:10px 0 4px}
.prog-fill{height:100%;border-radius:3px;background:linear-gradient(90deg,#D9C6E6,#E79A7D)}
.cy-hero{padding:15px;border-radius:16px;background:linear-gradient(135deg,#FFF5F3,#FFF8F0);border:1.5px solid #F4C7C2;margin-bottom:11px}
.cy-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin-bottom:7px}
.cy-day{aspect-ratio:1;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:600;background:#FAF8F4;color:#B8AFA8;border:1px solid #F0EBE3;font-family:'Nunito',sans-serif}
.cy-day.today{border-color:#A8C5A1;color:#4A6844;background:#F0F7EF}
.cy-day.period{background:#FFF0EE;border-color:#F4C7C2;color:#C4614A}
.cy-day.fertile{background:#F0F7EF;border-color:#A8C5A1;color:#4A6844}
.cy-day.ov{background:#FFF8E8;border-color:#E8C878;color:#A07820}
.sf-card{border-radius:13px;border:1.5px solid #F0EBE3;overflow:hidden;margin-bottom:7px;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.04)}
.sf-head{padding:12px 14px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;background:#fff;touch-action:manipulation}
.sf-head.open{background:#F4FAF3}
.sf-body{padding:0 14px 12px;display:none;font-size:11px;color:#6B6560;line-height:1.7;background:#F4FAF3}
.sf-body.open{display:block}
.prep-row{display:flex;gap:7px;padding:5px 0;border-bottom:1px solid #EFF5EE}
.prep-row:last-child{border-bottom:none}
.prep-num{width:18px;height:18px;border-radius:5px;background:#A8C5A1;color:#fff;font-size:9px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:2px}
.dose-box{padding:14px 15px;border-radius:15px;background:#F5F0FF;border:1.5px solid #D9C6E6;margin-bottom:11px}
.dose-res{padding:11px 13px;border-radius:12px;background:#fff;border:1.5px solid #D9C6E6;margin-top:9px}
.dose-big{font-size:25px;font-weight:800;color:#7A5CA8;font-family:'Nunito',sans-serif}
.bp-sec{background:#fff;border-radius:13px;border:1.5px solid #F0EBE3;padding:12px 14px;margin-bottom:8px;box-shadow:0 1px 3px rgba(0,0,0,.03)}
.bp-q{font-family:'Nunito',sans-serif;font-size:13px;color:#3B3B3B;font-weight:700;margin-bottom:7px}
.bp-opts{display:flex;flex-wrap:wrap;gap:5px}
.bp-opt{padding:5px 11px;border-radius:18px;font-size:11px;border:1.5px solid #E8E0D8;background:#FAF8F4;color:#6B6560;cursor:pointer;font-family:'Nunito',sans-serif;font-weight:600;touch-action:manipulation}
.bp-opt.sel{background:#F0F7EF;border-color:#A8C5A1;color:#4A6844}
.mini-prog{height:5px;border-radius:3px;background:#F0EBE3;overflow:hidden;margin-top:5px}
.mini-prog-fill{height:100%;border-radius:3px;background:#A8C5A1}
.photo-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
/* MODAL */
#modal{position:fixed;inset:0;background:rgba(59,42,28,.45);z-index:300;display:none;align-items:flex-end;justify-content:center;backdrop-filter:blur(4px)}
#modal.open{display:flex}
#modal-box{background:#fff;border-radius:22px 22px 0 0;padding:20px 20px 46px;width:100%;max-width:480px;border-top:1.5px solid #F0EBE3;max-height:88vh;overflow-y:auto;box-shadow:0 -4px 24px rgba(0,0,0,.1)}
#modal-title{font-family:'Nunito',sans-serif;font-size:19px;font-weight:800;color:#3B3B3B;margin-bottom:14px}
.field{margin-bottom:10px}
.field label{font-size:10px;color:#8E8A86;display:block;margin-bottom:3px;text-transform:uppercase;letter-spacing:.07em;font-weight:600}
.field input,.field select,.field textarea{width:100%;padding:9px 12px;border-radius:11px;font-size:13px;background:#FAF8F4;border:1.5px solid #E8E0D8;color:#3B3B3B}
.field input:focus,.field select:focus,.field textarea:focus{border-color:#A8C5A1;background:#fff}
.field textarea{resize:vertical;min-height:50px}
.mbtns{display:flex;gap:7px;margin-top:14px}
.bprim{flex:1;padding:12px;border-radius:13px;border:none;background:linear-gradient(135deg,#A8C5A1,#7DAE76);color:#fff;font-size:14px;font-weight:700;cursor:pointer;font-family:'Nunito',sans-serif}
.bsec{padding:12px 16px;border-radius:13px;border:1.5px solid #E8E0D8;background:#FAF8F4;color:#8E8A86;font-size:14px;cursor:pointer;font-family:'Nunito',sans-serif;font-weight:600}
/* CHAT */
.chat-wrap{display:flex;flex-direction:column;height:calc(100vh - 190px);min-height:340px}
.chat-msgs{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding-bottom:8px;scrollbar-width:none}
.chat-msgs::-webkit-scrollbar{display:none}
.chat-msg{max-width:86%;padding:10px 13px;border-radius:16px;font-size:12px;line-height:1.7}
.chat-msg.user{align-self:flex-end;background:linear-gradient(135deg,#A8C5A1,#7DAE76);color:#fff;border-radius:16px 16px 4px 16px}
.chat-msg.bot{align-self:flex-start;background:#fff;border:1.5px solid #F0EBE3;color:#3B3B3B;border-radius:16px 16px 16px 4px;box-shadow:0 1px 4px rgba(0,0,0,.05)}
.chat-msg.bot strong{color:#3B3B3B}
.typing span{display:inline-block;animation:blink 1.4s infinite;color:#B8AFA8}
.typing span:nth-child(2){animation-delay:.2s}
.typing span:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:0}40%{opacity:1}}
.sq-list{display:flex;flex-wrap:wrap;gap:5px;padding:5px 0;flex-shrink:0}
.sq-btn{padding:6px 11px;border-radius:18px;border:1.5px solid #C8DEC5;background:#F0F7EF;color:#4A6844;font-size:11px;cursor:pointer;font-family:'Nunito',sans-serif;font-weight:600;touch-action:manipulation}
.chat-row{display:flex;gap:7px;align-items:flex-end;padding-top:8px;border-top:1.5px solid #F0EBE3;flex-shrink:0}
.chat-in{flex:1;padding:9px 12px;border-radius:13px;font-size:12px;resize:none;min-height:40px;max-height:90px;line-height:1.4;background:#FAF8F4;border:1.5px solid #E8E0D8;color:#3B3B3B;font-family:'Inter',sans-serif}
.chat-in:focus{border-color:#A8C5A1;background:#fff}
.chat-go{width:40px;height:40px;border-radius:13px;border:none;background:linear-gradient(135deg,#A8C5A1,#7DAE76);color:#fff;font-size:16px;flex-shrink:0;cursor:pointer;touch-action:manipulation}
.chat-go:disabled{opacity:.4}
</style>
</head>
<body>

<div id="landing">
  <div class="land-logo">
    <img src="logo.png" alt="LittleBug" style="width:130px;height:auto;display:block"
      onerror="this.style.display='none'">
  </div>
  <div class="land-title"><span style="color:#5C3D2E">Little</span><span style="color:#A8C5A1">Bug</span></div>
  <div class="land-sub">From first hopes to first steps.</div>
  <div class="land-cards">
    <button class="mc ttc" onclick="setMode('ttc')"><span class="mc-icon">🌱</span><div><div class="mc-title">Trying to Conceive</div><div class="mc-sub">Cycle tracking, fertile window, ovulation, pre-conception guidance</div></div></button>
    <button class="mc preg" onclick="setMode('preg')"><span class="mc-icon">🌿</span><div><div class="mc-title">Pregnant</div><div class="mc-sub">Week-by-week, kick counter, contraction timer, birth plan</div></div></button>
    <button class="mc baby" onclick="setMode('baby')"><span class="mc-icon">🐞</span><div><div class="mc-title">We Have a Baby</div><div class="mc-sub">Schedule, feeding, sleep, solids guide, medicine dosing</div></div></button>
  </div>
  <p style="font-size:11px;color:#B8AFA8;margin-top:20px">Your journey. Our care. 🐞</p>
</div>

<div id="app">
  <div id="hdr">
    <div class="hdr-top">
      <div class="hdr-logo" onclick="switchMode()">
        <img src="logo.png" alt="LittleBug" style="width:28px;height:28px;object-fit:contain" onerror="this.style.display='none'">
        <div class="hdr-brand"><span style="color:#5C3D2E">Little</span><span style="color:#A8C5A1">Bug</span></div>
      </div>
      <div style="display:flex;gap:7px;align-items:center">
        <div class="mbadge" id="mbadge" onclick="switchMode()">🐞 Baby</div>
        <button class="icon-btn" onclick="openM('settings')">⚙️</button>
      </div>
    </div>
    <div id="stats-bar"></div>
  </div>
  <div id="nav"></div>
  <div id="content"></div>
</div>

<div id="modal">
  <div id="modal-box">
    <div id="modal-title">Log</div>
    <div id="modal-fields"></div>
    <div class="mbtns">
      <button class="bsec" onclick="closeM()">Cancel</button>
      <button class="bprim" onclick="saveM()">Save</button>
    </div>
  </div>
</div>

<script>

function ovDay(){return Math.round(S.cycleLen-14)}
function nextP(){if(!S.periods.length)return'—';const d=new Date((S.periods[S.periods.length-1].iso||new Date()));return new Date(d.getTime()+S.cycleLen*86400000).toLocaleDateString([],{month:'short',day:'numeric'});}
function calcW(){if(!S.pregDue)return S.pregWeek||20;const due=new Date(S.pregDue);const w=Math.floor((Date.now()-new Date(due.getTime()-280*86400000))/604800000);return Math.max(1,Math.min(42,w));}
function trimOf(w){return w<=13?'1st Tri':w<=26?'2nd Tri':'3rd Tri'}
function daysL(){if(!S.pregDue)return'—';const d=Math.ceil((new Date(S.pregDue)-Date.now())/86400000);return d>0?d+'d':d===0?'Today!':'Born!';}
function hour(){return new Date().getHours();}

// ── MODE ── exactly as working version
function setMode(m){
  S.mode=m;S.tab=MODE_TABS[m][0];
  if(m==='baby'&&!S.babyBirthday){S.babyBirthday=new Date().toISOString().slice(0,10);S.babyAge=0;}
  document.getElementById('landing').classList.add('hidden');
  document.getElementById('app').classList.add('on');
  sv();ra();
}
function switchMode(){
  document.getElementById('landing').classList.remove('hidden');
  document.getElementById('app').classList.remove('on');
}

// ── RENDER — exactly as working version ──
function ra(){rHdr();rNav();rContent();}

function rHdr(){
  const mb=document.getElementById('mbadge');
  if(mb){mb.textContent={ttc:'🌱 TTC',preg:'🌿 Pregnant',baby:'🐞 Baby'}[S.mode]||'🐞 Baby';mb.className='mbadge '+(S.mode||'baby');}
  const sb=document.getElementById('stats-bar');if(!sb)return;
  let stats=[];
  if(S.mode==='ttc')stats=[{l:'Cycle Day',v:cycleDay()||'—'},{l:'Cycle',v:S.cycleLen+'d'},{l:'Ovulation',v:'Day '+ovDay()},{l:'Next Period',v:nextP()}];
  else if(S.mode==='preg'){const w=calcW();stats=[{l:'Week',v:w},{l:'Trimester',v:trimOf(w)},{l:'Days Left',v:daysL()},{l:'Due',v:S.pregDue||'Not set'}];}
  else{if(S.babyBirthday)S.babyAge=calcBabyAge();const d=getAD(S.babyAge);stats=[{l:'Age',v:getBabyAgeDisplay()},{l:'Wake Win',v:d.ww},{l:'Naps',v:d.naps},{l:'Bedtime',v:d.bt}];}
  sb.innerHTML=stats.map((s,i)=>`<div class="stat"${i===stats.length-1?' style="border-right:none"':''}><div class="sv">${s.v}</div><div class="sl">${s.l}</div></div>`).join('');
}

function rNav(){
  const tabs=MODE_TABS[S.mode]||[];
  document.getElementById('nav').innerHTML=tabs.map(t=>`<button class="nb${S.tab===t?' active':''}" onclick="S.tab='${t}';S.exp=null;ra()">${TLBLS[t]||t}</button>`).join('');
  document.getElementById('content').innerHTML=tabs.map(t=>`<div id="p-${t}" class="tp${S.tab===t?' active':''}"></div>`).join('');
}

function rContent(){
  const fn={
    cycle:rCycle,log:rTtcLog,insights:rInsights,checklist:rChecklist,ask:rAsk,

// ── TTC ──
function rCycle(){
  const el=document.getElementById('p-cycle');if(!el)return;
  const cd=cycleDay();const ov=ovDay();const fs=ov-4;const inF=cd&&cd>=fs&&cd<=ov+1;
  let h=`<div class="cy-hero"><div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px"><div><div style="font-family:'Nunito',sans-serif;font-size:11px;font-weight:700;color:#E79A7D;text-transform:uppercase;letter-spacing:.06em;margin-bottom:3px">Current Cycle</div><div style="font-family:'Nunito',sans-serif;font-size:34px;font-weight:800;color:#3B3B3B;line-height:1">Day ${cd||'—'}</div><div style="font-size:11px;color:#8E8A86;margin-top:3px">${inF?'🟢 Fertile window open!':(cd&&cd<fs?`Fertile in ~${fs-cd} days`:'Outside fertile window')}</div></div><div style="text-align:right"><div style="font-size:10px;color:#8E8A86;margin-bottom:2px">Ovulation Est.</div><div style="font-family:'Nunito',sans-serif;font-size:16px;font-weight:700;color:#E79A7D">Day ${ov}</div></div></div><div class="cy-grid">`;
  for(let i=1;i<=35;i++){let cls='cy-day';if(i===cd)cls+=' today';if(i<=S.periodLen)cls+=' period';else if(i>=fs&&i<ov)cls+=' fertile';else if(i===ov)cls+=' ov';h+=`<div class="${cls}">${i}</div>`;}
  h+=`</div><div style="display:flex;gap:10px;font-size:10px;font-weight:600"><span style="color:#C4614A">🔴 Period</span><span style="color:#4A6844">🟢 Fertile</span><span style="color:#A07820">⭐ Ovulation</span></div></div>`;
  h+=`<div class="log-grid"><button class="log-card" onclick="openM('period')"><span class="ei">🔴</span><span>Log Period</span></button><button class="log-card" onclick="openM('bbt')"><span class="ei">🌡️</span><span>Log BBT</span></button><button class="log-card" onclick="openM('lh')"><span class="ei">⭐</span><span>LH Test</span></button><button class="log-card" onclick="openM('sym-ttc')"><span class="ei">📝</span><span>Symptoms</span></button></div>`;
  const recent=[...S.periods,...S.bbt,...S.lh,...S.symptoms].sort((a,b)=>(b.date||'').localeCompare(a.date||'')).slice(0,5);
  if(recent.length){h+=shd('Recent');recent.forEach(item=>{h+=`<div class="log-row"><div><div style="font-size:13px;font-weight:600;color:#3B3B3B">${item.label||''}</div><div style="font-size:11px;color:#8E8A86">${item.date||''}</div></div><button class="x-btn" onclick="delTtc('${item.id}')">×</button></div>`;});}
  h+=`<button class="prim-btn" style="margin-top:10px;background:linear-gradient(135deg,#D9C6E6,#C4A8E0)" onclick="if(confirm('Switch to Pregnancy mode?'))setMode('preg')">🌿 I\'m Pregnant! →</button>`;
  el.innerHTML=h;
}
function delTtc(id){['periods','bbt','lh','symptoms'].forEach(k=>{S[k]=(S[k]||[]).filter(x=>x.id!==id);});sv();ra();}

function rTtcLog(){
  const el=document.getElementById('p-log');if(!el)return;
  let h=shd('BBT Chart');
  if(S.bbt.length<2)h+=`<div class="info-b">Log at least 2 BBT readings to see your chart. Take temperature at the same time every morning before getting up.</div>`;
  else{const temps=S.bbt.slice(-14);const mn=Math.min(...temps.map(t=>t.temp));const mx=Math.max(...temps.map(t=>t.temp));h+=`<div class="card"><div style="display:flex;align-items:flex-end;gap:2px;height:55px">${temps.map(t=>{const pct=mx>mn?Math.round(((t.temp-mn)/(mx-mn))*80)+20:50;return`<div style="flex:1;background:linear-gradient(180deg,#E79A7D,rgba(231,154,125,.3));border-radius:3px 3px 0 0;height:${pct}%;min-height:4px"></div>`;}).join('')}</div></div>`;}
  h+=shd('LH Tests');
  if(!S.lh.length)h+=`<div style="font-size:12px;color:#B8AFA8;padding:6px 0">No LH tests logged yet.</div>`;
  else S.lh.slice(-5).forEach(l=>{h+=`<div class="log-row"><div><div style="font-size:13px;font-weight:600;color:#3B3B3B">${l.result||'LH Test'}</div><div style="font-size:11px;color:#8E8A86">${l.date}</div></div><button class="x-btn" onclick="delTtc('${l.id}')">×</button></div>`;});
  h+=shd('Symptoms');
  if(!S.symptoms.length)h+=`<div style="font-size:12px;color:#B8AFA8;padding:6px 0">No symptoms logged yet.</div>`;
  else S.symptoms.slice(-5).forEach(s=>{h+=`<div class="log-row"><div><div style="font-size:13px;font-weight:600;color:#3B3B3B">${s.syms?.join(', ')||'Symptom'}</div><div style="font-size:11px;color:#8E8A86">Day ${s.day||'?'} · ${s.date||''}</div></div><button class="x-btn" onclick="delTtc('${s.id}')">×</button></div>`;});
  el.innerHTML=h;
}

function rInsights(){
  const el=document.getElementById('p-insights');if(!el)return;
  let h=`<p class="intro">Fertility patterns and evidence-based guidance.</p>`;
  [{i:'🛌',t:'Time intercourse around ovulation',d:'Best time is 2 days before ovulation and the day of. Fertile window is roughly 5 days.'},{i:'🌡️',t:'Track BBT daily',d:'Temperature rises ~0.4°F after ovulation. Over time you\'ll see your pattern clearly.'},{i:'💊',t:'Start prenatal vitamins now',d:'Folic acid (400–800mcg) before conception reduces neural tube defects.'},{i:'👨',t:'Partner health matters too',d:'Sperm quality improves with: avoiding heat, supplements (CoQ10, zinc), no smoking.'},{i:'🚫',t:'Limit alcohol, smoking, excess caffeine',d:'Limit caffeine to <200mg/day. Both alcohol and smoking reduce fertility.'}].forEach((t,i)=>{const k=`ti${i}`,o=S.exp===k;h+=`<div class="acc"><div class="acc-h${o?' open':''}" onclick="tog('${k}')"><div style="display:flex;align-items:center;gap:9px"><span style="font-size:18px">${t.i}</span><div style="font-family:'Nunito',sans-serif;font-size:14px;font-weight:700;color:#3B3B3B">${t.t}</div></div><span class="chev${o?' open':''}">▾</span></div><div class="acc-b${o?' open':''}">${t.d}</div></div>`;});

    h+=`</div><button class="prim-btn" id="btn-go-baby" style="margin-top:10px" onclick="if(confirm('Switch to Baby mode?'))setMode('baby')">🐞 Baby Has Arrived! →</button>`;
  }

// ── PREGNANCY ──
function rWeek(){
  const el=document.getElementById('p-week');if(!el)return;
  const w=calcW();const wd=getWD(w);const pct=Math.round((w/40)*100);
  let h=`<div class="wk-hero"><div style="display:flex;justify-content:space-between;margin-bottom:4px"><div><div style="font-family:'Nunito',sans-serif;font-size:11px;font-weight:700;color:#9B72CF;text-transform:uppercase;letter-spacing:.06em">Week ${w} of 40</div><div style="font-size:11px;color:#8E8A86;margin-top:1px">${trimOf(w)}</div></div><div style="text-align:right"><div style="font-size:10px;color:#8E8A86">Due</div><div style="font-family:'Nunito',sans-serif;font-size:14px;font-weight:700;color:#9B72CF">${S.pregDue||'Not set'}</div></div></div><div class="size-big">${wd.s}</div><div style="text-align:center;margin-bottom:8px"><div id="wk-size-name" style="font-family:'Nunito',sans-serif;font-size:20px;font-weight:800;color:#3B3B3B">Size of a ${wd.n}</div><div style="font-size:12px;color:#8E8A86;margin-top:2px">${daysL()} to go</div></div><div class="prog-bar"><div class="prog-fill" id="prog-fill" style="width:${pct}%"></div></div><div style="display:flex;justify-content:space-between;font-size:9px;color:#8E8A86;font-weight:600"><span>Week 1</span><span id="wk-pct">${pct}%</span><span>Week 40</span></div></div>`;
  h+=`<div class="card"><div style="font-family:'Nunito',sans-serif;font-size:13px;font-weight:700;color:#3B3B3B;margin-bottom:5px">🍼 Baby this week</div><div id="wk-dev" style="font-size:12px;color:#6B6560;line-height:1.7">${wd.d}</div></div>`;
  h+=`<div class="tip-b" id="wk-tip">💡 ${wd.tip}</div>`;
  h+=shd('Week Selector');
  h+=`<div style="display:flex;align-items:center;gap:10px;margin-bottom:12px"><input type="range" min="4" max="42" value="${w}" id="week-slider" style="flex:1;accent-color:#9B72CF"><span style="font-family:'Nunito',sans-serif;font-size:13px;font-weight:700;color:#9B72CF;min-width:28px" id="week-lbl">W${w}</span></div>`;
  h+=shd('Labor Signs');
  [{s:'Regular contractions',d:'5-1-1: 5 min apart, 1 min long, 1 hr — call provider',c:'#C4614A'},{s:'Water breaks',d:'Clear/pinkish fluid — call provider immediately',c:'#E79A7D'},{s:'Bloody show',d:'Pink or brown mucus — labor may be near',c:'#F4C7C2'},{s:'Baby drops (lightening)',d:'Easier to breathe, more pelvic pressure',c:'#A8C5A1'}].forEach(s=>h+=`<div style="display:flex;gap:9px;padding:7px 0;border-bottom:1.5px solid #F5F1EC"><div style="width:4px;border-radius:2px;background:${s.c};flex-shrink:0"></div><div><div style="font-family:'Nunito',sans-serif;font-size:13px;font-weight:700;color:#3B3B3B">${s.s}</div><div style="font-size:11px;color:#8E8A86;margin-top:1px">${s.d}</div></div></div>`);
  el.innerHTML=h;
  document.getElementById('week-slider')?.addEventListener('input',function(){
    const w2=+this.value;S.pregWeek=w2;
    const wd2=getWD(w2);const pct2=Math.round((w2/40)*100);
    document.getElementById('week-lbl').textContent='W'+w2;
    const sizeEl=document.querySelector('.size-big');if(sizeEl)sizeEl.textContent=wd2.s;
    const nameEl=document.getElementById('wk-size-name');if(nameEl)nameEl.textContent='Size of a '+wd2.n;
    const devEl=document.getElementById('wk-dev');if(devEl)devEl.textContent=wd2.d;
    const tipEl=document.getElementById('wk-tip');if(tipEl)tipEl.textContent='💡 '+wd2.tip;
    const fillEl=document.getElementById('prog-fill');if(fillEl)fillEl.style.width=pct2+'%';
    const pctEl=document.getElementById('wk-pct');if(pctEl)pctEl.textContent=pct2+'%';
  });
}

let cActive=false,cStart=null,cIv=null;

  h+=shd('⚖️ Weight');
  h+=`<div style="display:flex;gap:7px;margin-bottom:9px"><input type="number" id="pwlb" placeholder="lbs" style="flex:1;padding:8px 10px;border-radius:11px;font-size:13px"><input type="number" id="pwoz" placeholder="oz" style="flex:1;padding:8px 10px;border-radius:11px;font-size:13px"><button onclick="addPW()" style="padding:8px 14px;border-radius:11px;border:none;background:#A8C5A1;color:#fff;font-size:13px;font-weight:700;cursor:pointer">+Add</button></div>`;
  if(S.pregWeight.length){const lw=S.pregWeight[S.pregWeight.length-1];h+=`<div class="info-b">Latest: <strong>${fwt(lw.kg)}</strong> on ${lw.date}</div>`;}
  h+=shd('🤒 Today\'s Symptoms');
  const todaySym=S.pregSymptoms.filter(s=>s.date===tod()).flatMap(s=>s.syms);

  h+=`</div>`;

function contrTap(){if(!cActive){cActive=true;cStart=Date.now();clearInterval(cIv);cIv=setInterval(()=>{const b=document.getElementById('cbtn');if(b)b.textContent=`⏹ Stop (${Math.round((Date.now()-cStart)/1000)}s)`;},500);}else{clearInterval(cIv);const dur=Math.round((Date.now()-cStart)/1000);S.contractions.push({id:uid(),dur,date:tod(),time:nw()});cActive=false;cStart=null;sv();rPregTrack();}}
function addPW(){const lb=+document.getElementById('pwlb').value||0;const oz=+document.getElementById('pwoz').value||0;if(!lb&&!oz)return;S.pregWeight.push({id:uid(),kg:lbKg(lb,oz),date:tod()});sv();rPregTrack();}
function togPSym(sym){let t=S.pregSymptoms.find(s=>s.date===tod());if(!t){t={id:uid(),date:tod(),syms:[]};S.pregSymptoms.push(t);}if(t.syms.includes(sym))t.syms=t.syms.filter(s=>s!==sym);else t.syms.push(sym);sv();rPregTrack();}
