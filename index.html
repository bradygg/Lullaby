<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>LittleBug — From first hopes to first steps</title>
<style>
@import url("https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Lato:wght@300;400;700&display=swap");

/* ═══════════════════════════════════════════
   LITTLEBUG BRAND SYSTEM v2
   From: littlebug-design-package-v2
   ══════════════════════════════════════════ */
:root {
  /* Core Palette */
  --sage:       #A8C5A1;
  --sage-l:     #C8DFC3;
  --sage-d:     #7B9E74;
  --blush:      #F4C7C2;
  --blush-l:    #FAE9E6;
  --blush-d:    #E8948A;
  --lav:        #D9C6E6;
  --lav-l:      #EDE4F3;
  --terra:      #E79A7D;
  --terra-l:    #F4BEAA;
  --terra-d:    #C8724F;
  --cream:      #FFF4E6;
  --cream-d:    #F5E8D4;
  --brown:      #4A2C2A;
  --brown-l:    #6B4240;
  --text:       #3B3B3B;
  --muted:      #8E8A86;
  --white:      #FFFFFF;

  /* Border Radius */
  --r-sm: 10px; --r-md: 18px; --r-lg: 26px; --r-xl: 36px; --r-pill: 999px;

  /* Shadows */
  --sh-sm: 0 2px 10px rgba(74,44,42,.07);
  --sh-md: 0 6px 24px rgba(74,44,42,.11);
  --sh-lg: 0 12px 48px rgba(74,44,42,.15);

  /* Typography */
  --fh: 'Nunito', sans-serif;
  --fb: 'Lato', sans-serif;

  /* Mode aliases */
  --trying-primary: var(--blush);
  --trying-light: var(--blush-l);
  --trying-border: var(--blush-d);
  --trying-deep: var(--terra);

  --growing-primary: var(--sage);
  --growing-light: var(--sage-l);
  --growing-border: var(--sage-d);
  --growing-deep: var(--sage-d);

  --baby-primary: var(--terra);
  --baby-light: var(--terra-l);
  --baby-border: var(--terra-d);
  --baby-deep: var(--terra-d);

  /* Ink aliases → brown tones */
  --ink: var(--brown);
  --ink-soft: var(--brown-l);
  --ink-muted: var(--muted);

  --font-body: var(--fb);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--cream);color:var(--text);min-height:100vh;font-family:var(--fb);overflow-x:hidden}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse at 15% 25%,var(--blush-l),transparent 45%),radial-gradient(ellipse at 85% 75%,var(--sage-l),transparent 45%),radial-gradient(ellipse at 55% 5%,var(--lav-l),transparent 40%);pointer-events:none;z-index:0}

/* SCREENS */
.screen{min-height:100vh;width:100%;position:relative;z-index:1}
#screen-landing{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 20px;text-align:center}
#screen-app{display:none;flex-direction:column}

/* LANDING */
.logo{width:90px;height:90px;margin:0 auto 8px;display:block}
h1{font-size:36px;font-weight:700;color:var(--ink);letter-spacing:-.02em;margin-bottom:6px}
.sub{font-size:12px;color:#8E8A86;margin-bottom:28px;line-height:1.6;max-width:260px}
.cards{display:flex;flex-direction:column;gap:10px;width:100%;max-width:320px}
.card-btn{padding:18px;border-radius:var(--r-lg);border:2px solid var(--blush-l);background:var(--white);box-shadow:var(--sh-sm);display:flex;align-items:center;gap:14px;text-align:left;cursor:pointer;width:100%;font-family:system-ui,sans-serif;-webkit-appearance:none;appearance:none}
.card-btn:active{opacity:.7;transform:scale(.97)}
.card-icon{font-size:32px;flex-shrink:0}
.card-title{font-size:15px;font-weight:600;color:var(--ink);display:block;margin-bottom:2px}
.card-desc{font-size:10px;color:#8E8A86;display:block;line-height:1.4}

/* APP HEADER */
#hdr{padding:16px 18px 12px;background:rgba(250,248,244,.98);border-bottom:1px solid rgba(59,59,59,.06)}
.hdr-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.mode-pill{padding:5px 11px;border-radius:18px;font-size:11px;font-weight:600;border:none;cursor:pointer}
.mode-pill.baby{background:var(--terra-l);color:var(--terra-d)}
.mode-pill.ttc{background:var(--blush-l);color:var(--blush-d)}
.mode-pill.preg{background:var(--lav-l);color:var(--lav)}
.settings-btn{width:34px;height:34px;border-radius:10px;border:1px solid rgba(59,59,59,.1);background:rgba(59,59,59,.05);color:#8E8A86;font-size:14px;cursor:pointer}
.brand-center{text-align:center;margin-bottom:10px}
.brand-name{font-size:26px;font-weight:700;color:var(--ink)}
.brand-sub{font-size:10px;color:#8E8A86;cursor:pointer}
#stats-bar{display:flex;justify-content:center;flex-wrap:wrap}
.stat{text-align:center;padding:3px 10px;border-right:1px solid rgba(59,59,59,.07)}
.stat:last-child{border-right:none}
.sv{font-size:12px;font-weight:500;color:var(--ink)}
.sl{font-size:8px;color:#8E8A86;text-transform:uppercase;letter-spacing:.06em;margin-top:1px}

/* NAV */
#nav{display:flex;overflow-x:auto;border-bottom:1px solid rgba(59,59,59,.06);background:rgba(250,248,244,.97);position:sticky;top:0;z-index:100;scrollbar-width:none}
#nav::-webkit-scrollbar{display:none}
.nav-btn{flex-shrink:0;padding:11px 13px;border:none;background:transparent;color:#8E8A86;font-size:11px;border-bottom:2px solid transparent;white-space:nowrap;font-weight:500;cursor:pointer;font-family:system-ui,sans-serif}
.nav-btn.active{color:var(--brown);border-bottom-color:var(--sage);font-weight:700}

/* CONTENT */
#content{padding:14px 16px;position:relative;z-index:1;padding-bottom:80px}
.page{display:none}
.page.active{display:block}

/* COMMON UI */
.section-hd{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;margin:14px 0 7px;font-weight:700;display:flex;align-items:center;gap:6px;font-family:var(--fb)}
.section-hd::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,rgba(168,197,161,.3),transparent)}
.info-box{padding:10px 13px;border-radius:11px;background:rgba(168,197,161,.05);border:1px solid rgba(168,197,161,.12);font-size:11px;color:#8E8A86;line-height:1.7;margin-bottom:8px}
.warn-box{padding:10px 13px;border-radius:11px;background:rgba(231,154,125,.09);border:1px solid rgba(231,154,125,.22);font-size:11px;color:#FDBA74;line-height:1.7;margin-bottom:8px}
.good-box{padding:10px 13px;border-radius:11px;background:rgba(168,197,161,.08);border:1px solid rgba(168,197,161,.2);font-size:11px;color:#A8C5A1;line-height:1.7;margin-bottom:8px}
.panel{padding:12px 14px;border-radius:13px;background:rgba(59,59,59,.03);border:1px solid rgba(59,59,59,.08);margin-bottom:8px}
.log-row{display:flex;justify-content:space-between;align-items:center;padding:9px 11px;border-radius:10px;background:rgba(59,59,59,.03);border:1px solid rgba(59,59,59,.07);margin-bottom:4px}
.x-btn{background:none;border:none;color:#BDB5AA;font-size:18px;padding:2px 4px;cursor:pointer;font-family:system-ui}
.tab-bar{display:flex;border-radius:11px;overflow:hidden;border:1px solid rgba(59,59,59,.08);margin-bottom:10px;background:rgba(59,59,59,.03)}
.tab-opt{flex:1;padding:9px 4px;border:none;background:transparent;color:#8E8A86;font-size:11px;cursor:pointer;font-family:system-ui,sans-serif;font-weight:500}
.tab-opt.active{background:rgba(168,197,161,.18);color:var(--ink)}
.log-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:8px}
.log-card{padding:13px 6px;border-radius:12px;border:1px solid rgba(59,59,59,.07);background:rgba(59,59,59,.04);display:flex;flex-direction:column;align-items:center;gap:5px;cursor:pointer;font-family:system-ui,sans-serif;color:#8E8A86;font-size:12px}
.log-card:active{transform:scale(.96);background:rgba(59,59,59,.08)}
.log-card .ei{font-size:22px}
.rings{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:9px 0 11px}
.ring{text-align:center;padding:9px 2px;border-radius:12px;background:rgba(59,59,59,.03);border:1px solid rgba(59,59,59,.07)}
.rv{font-size:17px;font-weight:500;color:var(--ink)}
.rl{font-size:8px;color:#8E8A86;text-transform:uppercase;margin-top:1px}
.ww-box{padding:14px;border-radius:15px;background:linear-gradient(135deg,rgba(168,197,161,.15),rgba(168,85,247,.08));border:1px solid rgba(168,197,161,.22);margin-bottom:11px}
.since-row{display:flex;gap:6px;margin-bottom:10px}
.since-chip{display:flex;flex-direction:column;align-items:center;padding:10px 5px;border-radius:12px;background:rgba(59,59,59,.04);border:1px solid rgba(59,59,59,.08);flex:1;cursor:pointer}
.since-chip.urgent{border-color:rgba(248,113,113,.35);background:rgba(248,113,113,.07)}
.since-chip.late{border-color:rgba(231,154,125,.28);background:rgba(231,154,125,.07)}
.since-chip.ok{border-color:rgba(168,197,161,.22);background:rgba(168,197,161,.05)}
.tl{position:relative}
.tl-line{position:absolute;left:19px;top:0;bottom:0;width:1px;background:linear-gradient(180deg,rgba(168,197,161,.3),transparent)}
.tl-row{display:flex;align-items:flex-start;margin-bottom:5px}
.tl-dot-wrap{width:38px;flex-shrink:0;display:flex;justify-content:center}
.tl-dot{width:12px;height:12px;border-radius:50%;margin-top:12px;z-index:1;flex-shrink:0}
.tl-card{flex:1;padding:10px 12px;border-radius:10px;cursor:pointer;border:1px solid rgba(59,59,59,.06);border-left-width:3px;background:rgba(59,59,59,.03)}
.tl-label{font-size:12px;color:var(--ink);font-weight:500}
.tl-time{font-size:10px;color:#8E8A86;margin-top:1px}
.tl-detail{font-size:11px;color:#8E8A86;line-height:1.6;display:none;margin-top:6px}
.tl-detail.open{display:block}
.chev{color:#8E8A86;font-size:11px;transition:transform .2s;display:inline-block}
.chev.open{transform:rotate(180deg)}
.acc-wrap{border-radius:12px;border:1px solid rgba(59,59,59,.08);overflow:hidden;margin-bottom:6px}
.acc-head{padding:12px 14px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;background:rgba(59,59,59,.03)}
.acc-head.open{background:rgba(168,197,161,.09)}
.acc-body{padding:0 14px 12px;display:none;font-size:11px;color:#8E8A86;line-height:1.7;background:rgba(168,197,161,.04)}
.acc-body.open{display:block}
.cl-row{display:flex;align-items:flex-start;gap:9px;padding:8px 0;border-bottom:1px solid rgba(59,59,59,.04)}
.cl-row:last-child{border-bottom:none}
.cl-check{width:19px;height:19px;border-radius:5px;border:1px solid rgba(168,197,161,.3);background:rgba(168,197,161,.07);flex-shrink:0;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:10px;color:#A8C5A1;margin-top:1px}
.cl-check.done{background:rgba(168,197,161,.35);border-color:rgba(168,197,161,.6)}
.chip-tag{display:inline-flex;padding:4px 9px;border-radius:7px;font-size:11px;margin:2px;border:1px solid rgba(59,59,59,.08);background:rgba(59,59,59,.04);color:#8E8A86;cursor:pointer}
.chip-tag.on{background:rgba(168,197,161,.18);border-color:rgba(168,197,161,.35);color:var(--ink)}
.chip-tag.done{background:rgba(168,197,161,.09);border-color:rgba(168,197,161,.25);color:#A8C5A1}
.primary-btn{padding:12px;border-radius:12px;border:none;background:linear-gradient(135deg,var(--sage-d),var(--sage));color:#fff;font-size:14px;font-weight:500;width:100%;cursor:pointer;font-family:system-ui,sans-serif}
.primary-btn:active{opacity:.85}
.cycle-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin-bottom:8px}
.cy-day{aspect-ratio:1;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:500;background:rgba(59,59,59,.04);color:#8E8A86;border:1px solid rgba(59,59,59,.05)}
.cy-day.today{border-color:rgba(168,197,161,.5);color:#D9C6E6}
.cy-day.period{background:rgba(244,199,194,.25);border-color:rgba(244,199,194,.4);color:#F4C7C2}
.cy-day.fertile{background:rgba(168,197,161,.15);border-color:rgba(168,197,161,.3);color:#A8C5A1}
.cy-day.ov{background:rgba(231,154,125,.25);border-color:rgba(231,154,125,.4);color:#E79A7D}
.wk-hero{padding:18px;border-radius:16px;background:linear-gradient(135deg,rgba(217,198,230,.12),rgba(231,154,125,.07));border:1px solid rgba(217,198,230,.2);margin-bottom:11px}
.size-big{font-size:52px;text-align:center;margin:8px 0;line-height:1}
.prog-bar{height:5px;border-radius:3px;background:rgba(59,59,59,.06);overflow:hidden;margin:9px 0 3px}
.prog-fill{height:100%;border-radius:3px;background:linear-gradient(90deg,#8BAF83,#A8C5A1,#E79A7D)}
.sf-card{border-radius:13px;border:1px solid rgba(59,59,59,.08);overflow:hidden;margin-bottom:6px}
.sf-head{padding:12px 14px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;background:rgba(59,59,59,.03)}
.sf-head.open{background:rgba(168,197,161,.07)}
.sf-body{padding:0 14px 12px;display:none;font-size:11px;color:#8E8A86;line-height:1.7;background:rgba(168,197,161,.03)}
.sf-body.open{display:block}
.prep-row{display:flex;gap:8px;padding:5px 0;border-bottom:1px solid rgba(59,59,59,.04)}
.prep-row:last-child{border-bottom:none}
.prep-num{width:18px;height:18px;border-radius:5px;background:rgba(168,197,161,.15);color:#A8C5A1;font-size:9px;font-weight:600;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px}
.dose-box{padding:14px;border-radius:14px;background:rgba(172,154,200,.07);border:1px solid rgba(172,154,200,.18);margin-bottom:11px}
.dose-result{padding:12px 14px;border-radius:12px;background:rgba(172,154,200,.1);border:1px solid rgba(172,154,200,.25);margin-top:9px}
.dose-amount{font-size:26px;font-weight:600;color:#D9C6E6}

/* MODAL */
#modal-overlay{position:fixed;inset:0;background:rgba(59,59,59,.65);z-index:300;display:none;align-items:flex-end;justify-content:center;backdrop-filter:blur(8px)}
#modal-overlay.open{display:flex}
#modal-box{background:var(--white);border-radius:var(--r-xl) var(--r-xl) 0 0;padding:22px 20px 48px;width:100%;max-width:480px;border-top:none;box-shadow:var(--sh-lg);max-height:88vh;overflow-y:auto}
#modal-title{font-size:18px;font-weight:700;color:var(--ink);margin-bottom:14px}
.field{margin-bottom:10px}
.field label{font-size:10px;color:#8E8A86;display:block;margin-bottom:3px;text-transform:uppercase;letter-spacing:.07em;font-weight:600}
.field input,.field select,.field textarea{width:100%;padding:9px 12px;border-radius:10px;font-size:13px;color:var(--ink);background:rgba(59,59,59,.06);border:1px solid rgba(59,59,59,.12);font-family:system-ui,sans-serif}
.field textarea{resize:vertical;min-height:50px}
.modal-btns{display:flex;gap:7px;margin-top:14px}
.btn-primary{flex:1;padding:12px;border-radius:12px;border:none;background:linear-gradient(135deg,var(--sage-d),var(--sage));color:#fff;font-size:14px;font-weight:500;cursor:pointer;font-family:system-ui,sans-serif}
.btn-cancel{padding:12px 15px;border-radius:12px;border:1px solid rgba(59,59,59,.1);background:transparent;color:#8E8A86;font-size:14px;cursor:pointer;font-family:system-ui,sans-serif}

/* CHAT */
.chat-wrap{display:flex;flex-direction:column;height:calc(100vh - 200px);min-height:340px}
.chat-msgs{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding-bottom:8px;scrollbar-width:none}
.chat-msgs::-webkit-scrollbar{display:none}
.chat-msg{max-width:86%;padding:10px 13px;border-radius:15px;font-size:12px;line-height:1.7}
.chat-msg.user{align-self:flex-end;background:linear-gradient(135deg,var(--sage-d),var(--sage));color:#fff;border-radius:15px 15px 4px 15px}
.chat-msg.bot{align-self:flex-start;background:rgba(59,59,59,.05);border:1px solid rgba(59,59,59,.1);color:var(--ink);border-radius:15px 15px 15px 4px}
.chat-msg.bot strong{color:var(--ink)}
.typing span{display:inline-block;animation:blink 1.4s infinite;color:#8E8A86}
.typing span:nth-child(2){animation-delay:.2s}
.typing span:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:0}40%{opacity:1}}
.sq-list{display:flex;flex-wrap:wrap;gap:5px;padding:5px 0;flex-shrink:0}
.sq-btn{padding:7px 12px;border-radius:var(--r-pill);border:1.5px solid var(--sage-l);background:var(--sage-l);color:var(--sage-d);font-size:11px;cursor:pointer;font-family:var(--fb);text-align:left}
.chat-input-row{display:flex;gap:7px;align-items:flex-end;padding-top:8px;border-top:1px solid rgba(59,59,59,.07);flex-shrink:0}
.chat-input{flex:1;padding:9px 12px;border-radius:12px;font-size:12px;resize:none;min-height:40px;max-height:90px;line-height:1.4;background:rgba(59,59,59,.05);border:1px solid rgba(168,197,161,.25);color:var(--ink);font-family:system-ui,sans-serif}
.chat-go{width:40px;height:40px;border-radius:12px;border:none;background:linear-gradient(135deg,var(--sage-d),var(--sage));color:#fff;font-size:16px;flex-shrink:0;cursor:pointer}
.chat-go:disabled{opacity:.4}
.bp-section{background:rgba(59,59,59,.03);border-radius:12px;border:1px solid rgba(59,59,59,.08);padding:12px;margin-bottom:8px}
.bp-q{font-size:12px;color:var(--ink);font-weight:500;margin-bottom:7px}
.bp-opts{display:flex;flex-wrap:wrap;gap:5px}
.bp-opt{padding:5px 11px;border-radius:8px;font-size:11px;border:1px solid rgba(59,59,59,.1);background:rgba(59,59,59,.04);color:#8E8A86;cursor:pointer;font-family:system-ui,sans-serif}
.bp-opt.sel{background:rgba(168,197,161,.2);border-color:rgba(168,197,161,.4);color:var(--ink)}
</style>
</head>
<body>

<!-- LANDING -->
<div id="screen-landing" class="screen">
  <img id="lb-logo-landing" style="width:240px;height:auto;margin:0 auto 2px;display:block" alt="LittleBug">
  
  <p class="sub" style="font-size:11px;color:var(--ink-muted);margin-bottom:6px;line-height:1.5;max-width:260px;text-align:center">From first hopes to first steps.</p>
  <div style="margin-top:8px;padding:0 4px">
    <!-- Journey Row — matches brand design package style -->
    <div style="display:flex;align-items:flex-start;justify-content:center;gap:0;margin-bottom:20px">

      <!-- TRYING -->
      <button id="btn-ttc" style="background:none;border:none;cursor:pointer;padding:0;display:flex;flex-direction:column;align-items:center;gap:6px;flex:1;max-width:100px" onclick="this.blur()">
        <div style="width:80px;height:80px;border-radius:50%;background:var(--blush-l);display:flex;align-items:center;justify-content:center;box-shadow:var(--sh-sm);transition:transform .15s" onmouseover="this.style.transform='scale(1.05)'" onmouseout="this.style.transform='scale(1)'">
          <svg width="70" height="70" viewBox="0 0 70 70" fill="none">
            <path d="M35 52 C24 44 16 36 16 26 C16 18 22 12 29 14 C31 14.5 33 16 35 18 C37 16 39 14.5 41 14 C48 12 54 18 54 26 C54 36 46 44 35 52Z" fill="#E79A7D"/>
            <path d="M35 52 C24 44 16 36 16 26 C16 18 22 12 29 14 C31 14.5 33 16 35 18 C37 16 39 14.5 41 14 C48 12 54 18 54 26 C54 36 46 44 35 52Z" fill="none" stroke="#C8724F" stroke-width="1.5"/>
            <line x1="35" y1="18" x2="35" y2="8" stroke="#7B9E74" stroke-width="2.5" stroke-linecap="round"/>
            <path d="M35 14 C33 10 28 9 27 11 C28 13 32 14 35 14Z" fill="#7B9E74"/>
            <path d="M35 11 C37 7 42 6 43 8 C42 10 38 11 35 11Z" fill="#A8C5A1"/>
            <path d="M43 8 C44 5.5 47.5 5.5 48.5 8 C48.5 10.5 46 12.5 46 12.5 C46 12.5 43 10.5 43 8Z" fill="#E79A7D"/>
          </svg>
        </div>
        <span style="font-family:var(--fh);font-weight:800;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--terra-d)">TRYING</span>
        <span style="font-family:var(--fb);font-size:10px;color:var(--muted);text-align:center;line-height:1.4;max-width:90px">Cycle · Ovulation<br>TTC Insights</span>
      </button>

      <!-- ARROW 1 -->
      <div style="padding-top:28px;flex-shrink:0">
        <svg width="36" height="20" viewBox="0 0 36 20" fill="none">
          <path d="M2 10 L28 10" stroke="#E79A7D" stroke-width="2.5" stroke-linecap="round"/>
          <path d="M22 4 L30 10 L22 16" stroke="#E79A7D" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

function calcDose(){
  const lb=+document.getElementById('d-lb')?.value||0;const oz=+document.getElementById('d-oz')?.value||0;
  const el=document.getElementById('dose-result');if(!el||(!lb&&!oz)){if(el)el.innerHTML='';return;}
  const kg=lbKg(lb,oz);S.wtKg=kg;sv();
  const mn=document.getElementById('d-med')?.value;const med=MEDS[mn];if(!med){el.innerHTML='';return;}
  const note=med.calc(kg);
  el.innerHTML=`<div class="dose-result"><div class="dose-amount">${note.split('·')[0].trim()}</div><div style="font-size:10px;color:#818CF8;margin-top:4px;line-height:1.7">${note}${med.interval?'<br>Frequency: <strong style="color:#D9C6E6">'+med.interval+'</strong>':''}<br>${med.note}</div></div>`;
}

function saveM(){
  const type=S.mType;if(!type)return;

  const tv=document.getElementById('m-time')?.value;const e={id:uid(),type,time:tv||nw(),date:tod()};
  if(type==='feed'||type==='pump'){const v=+document.getElementById('m-vol')?.value;if(v){e.ml=S.unit==='oz'?ozToMl(v):Math.round(v);e.vd=S.unit==='oz'?v+'oz':v+'ml';}}

  if(type==='solids'){e.food=document.getElementById('m-food')?.value;e.meal=document.getElementById('m-meal')?.value;e.rx=document.getElementById('m-rx')?.value;S.foods.unshift(e);}
  else if(type==='temp'){const tf=+document.getElementById('m-tempf')?.value;if(tf)S.health.temps.unshift({id:uid(),f:tf,meth:document.getElementById('m-tmeth')?.value,time:e.time,date:e.date});}
  else if(type==='med')S.health.meds.unshift({id:uid(),med:document.getElementById('m-med')?.value,dose:document.getElementById('m-dose')?.value,reason:document.getElementById('m-reason')?.value,time:e.time,date:e.date});
  else if(type==='visit'){const lb=+document.getElementById('m-vlb')?.value||0;const oz=+document.getElementById('m-voz2')?.value||0;const kg=(lb||oz)?lbKg(lb,oz):null;if(kg)S.wtKg=kg;S.health.visits.unshift({id:uid(),vt:document.getElementById('m-vt')?.value,date:document.getElementById('m-vdate')?.value||tod(),weight:fwt(kg),note:e.note});}
  else if(type==='period'){const pd=document.getElementById('m-pdate')?.value;const dt=pd?new Date(pd):new Date();const label=dt.toLocaleDateString([],{month:'short',day:'numeric'});S.periods.push({id:uid(),iso:pd||new Date().toISOString().slice(0,10),days:+document.getElementById('m-pdays')?.value||S.periodLen,date:label,label:`Period started ${label}`});}
  else if(type==='bbt'){const t=+document.getElementById('m-bbtf')?.value;if(t)S.bbt.push({id:uid(),temp:t,time:e.time,date:e.date,note:e.note,label:`BBT ${t}°F`});}
  else if(type==='lh'){const res=document.getElementById('m-lhres')?.value;S.lh.push({id:uid(),result:res,time:e.time,date:e.date,label:`LH: ${res}`});}
  else if(type==='sym-ttc'){const cd=cycDay();const SYMS=['Cramps','Spotting','Bloating','Breast tenderness','Mood changes','Fatigue','Headache','Nausea','Increased discharge'];const sel=SYMS.filter(s=>document.querySelector(`[data-sym="${s}"]`)?.classList.contains('on'));S.symptoms.push({id:uid(),syms:sel,day:cd,date:e.date,time:e.time,label:sel.join(', ')});}
  else if(type==='appt'){const adate=document.getElementById('m-adate')?.value;S.appts.push({id:uid(),type:document.getElementById('m-atype')?.value||'Appointment',date:adate||tod(),time:document.getElementById('m-atime')?.value,note:e.note,upcoming:!!adate&&new Date(adate)>=new Date()});}
  else if(['feed','sleep','diaper','pump'].includes(type))S.logs.unshift(e);
  sv();closeM();ra();
}
