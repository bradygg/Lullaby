<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>LittleBug</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:#FAF8F4;color:#3B3B3B;min-height:100vh;font-family:'Inter',sans-serif;overflow-x:hidden}
h1,h2,h3,.brand-name,.section-title{font-family:'Nunito',sans-serif}
button{cursor:pointer;font-family:'Inter',sans-serif;transition:all .18s}
input,textarea,select{font-family:'Inter',sans-serif;color:#3B3B3B;background:#fff;border:1.5px solid #E8E0D8;outline:none;transition:border .15s}
input:focus,textarea:focus,select:focus{border-color:#A8C5A1}
input::placeholder,textarea::placeholder{color:#B8AFA8}
select option{background:#fff;color:#3B3B3B}

/* ── LANDING ── */
#screen-landing{position:relative;z-index:1;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 24px;text-align:center;overflow-y:auto;background:#FAF8F4}
#screen-landing.hidden{display:none}
.land-logo-wrap{margin:0 auto 20px;animation:float 3s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.brand-name{font-family:'Nunito',sans-serif;font-size:38px;font-weight:800;letter-spacing:-.5px;margin-bottom:6px}
.brand-name span:first-child{color:#5C4033}
.brand-name span:last-child{color:#A8C5A1}
.brand-tagline{font-size:13px;color:#8E8A86;margin-bottom:32px;font-style:italic}
.land-cards{display:flex;flex-direction:column;gap:12px;width:100%;max-width:340px}
.land-card{padding:18px 20px;border-radius:20px;border:2px solid #E8E0D8;background:#fff;display:flex;align-items:center;gap:16px;text-align:left;cursor:pointer;width:100%;transition:all .2s;box-shadow:0 2px 8px rgba(0,0,0,.06);touch-action:manipulation;font-family:'Inter',sans-serif}
.land-card:active{transform:scale(.97)}
.land-card.ttc{border-color:#F4C7C2}
.land-card.ttc:active{background:#FFF8F7;border-color:#E79A7D}
.land-card.preg{border-color:#D9C6E6}
.land-card.preg:active{background:#FAF7FF;border-color:#C4A8E0}
.land-card.baby{border-color:#A8C5A1}
.land-card.baby:active{background:#F4FAF3;border-color:#7DAE76}
.land-card-icon{font-size:36px;flex-shrink:0}
.land-card-title{font-family:'Nunito',sans-serif;font-size:16px;font-weight:700;color:#3B3B3B;margin-bottom:2px}
.land-card-sub{font-size:11px;color:#8E8A86;line-height:1.4}

/* ── APP SHELL ── */
#screen-app{display:none;flex-direction:column;min-height:100vh;padding-bottom:70px}
#screen-app.on{display:flex}

/* ── HEADER ── */
#hdr{padding:14px 18px 10px;background:#fff;border-bottom:1px solid #F0EBE3;position:sticky;top:0;z-index:100;box-shadow:0 1px 4px rgba(0,0,0,.05)}
.hdr-row1{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.hdr-logo{display:flex;align-items:center;gap:8px;cursor:pointer}
.hdr-brand{font-family:'Nunito',sans-serif;font-size:20px;font-weight:800}
.hdr-brand span:first-child{color:#5C4033}
.hdr-brand span:last-child{color:#A8C5A1}
.mode-pill{padding:4px 11px;border-radius:20px;font-size:11px;font-weight:600;border:none;cursor:pointer;font-family:'Nunito',sans-serif}
.mode-pill.ttc{background:#FFF0EE;color:#E79A7D;border:1.5px solid #F4C7C2}
.mode-pill.preg{background:#F5F0FF;color:#9B72CF;border:1.5px solid #D9C6E6}
.mode-pill.baby{background:#F0F7EF;color:#6A9E63;border:1.5px solid #A8C5A1}
.hdr-right{display:flex;gap:8px;align-items:center}
.icon-btn{width:36px;height:36px;border-radius:12px;border:1.5px solid #E8E0D8;background:#FAF8F4;color:#8E8A86;font-size:15px;display:flex;align-items:center;justify-content:center}
#stats-bar{display:flex;overflow-x:auto;gap:0;scrollbar-width:none}
#stats-bar::-webkit-scrollbar{display:none}
.stat{flex-shrink:0;text-align:center;padding:3px 12px;border-right:1px solid #F0EBE3}
.stat:last-child{border-right:none}
.sv{font-size:12px;font-weight:600;color:#3B3B3B;font-family:'Nunito',sans-serif}
.sl{font-size:8px;color:#8E8A86;letter-spacing:.06em;text-transform:uppercase;margin-top:1px}

/* ── BOTTOM NAV ── */
#bottom-nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #F0EBE3;display:flex;z-index:200;padding-bottom:env(safe-area-inset-bottom);box-shadow:0 -2px 8px rgba(0,0,0,.06)}
.bnav-btn{flex:1;padding:10px 4px 8px;border:none;background:transparent;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;font-family:'Inter',sans-serif}
.bnav-icon{font-size:20px;transition:transform .15s}
.bnav-label{font-size:9px;color:#B8AFA8;font-weight:500;letter-spacing:.02em;text-transform:uppercase;transition:color .15s}
.bnav-btn.active .bnav-label{color:#A8C5A1;font-weight:700}
.bnav-btn.active .bnav-icon{transform:scale(1.15)}

/* ── CONTENT ── */
#content{flex:1;padding:16px;overflow-y:auto}
.page{display:none}
.page.active{display:block}

/* ── COMMON COMPONENTS ── */
.section-hd{font-family:'Nunito',sans-serif;font-size:13px;font-weight:700;color:#3B3B3B;text-transform:uppercase;letter-spacing:.06em;margin:16px 0 8px;display:flex;align-items:center;gap:6px}
.section-hd::after{content:'';flex:1;height:1.5px;background:#F0EBE3;border-radius:2px}
.intro-text{font-size:13px;color:#8E8A86;margin-bottom:12px;line-height:1.6}
.card{padding:14px 16px;border-radius:16px;background:#fff;border:1.5px solid #F0EBE3;margin-bottom:10px;box-shadow:0 1px 4px rgba(0,0,0,.04)}
.card-title{font-family:'Nunito',sans-serif;font-size:14px;font-weight:700;color:#3B3B3B;margin-bottom:6px}
.info-box{padding:12px 14px;border-radius:14px;background:#F0F7EF;border:1.5px solid #C8DEC5;font-size:12px;color:#5A7A55;line-height:1.7;margin-bottom:10px}
.warn-box{padding:12px 14px;border-radius:14px;background:#FFF5F0;border:1.5px solid #F4C7C2;font-size:12px;color:#C4614A;line-height:1.7;margin-bottom:10px}
.good-box{padding:12px 14px;border-radius:14px;background:#F5F0FF;border:1.5px solid #D9C6E6;font-size:12px;color:#7A5CA8;line-height:1.7;margin-bottom:10px}
.tip-box{padding:12px 14px;border-radius:14px;background:#FFF8F4;border:1.5px solid #F4D4C2;font-size:12px;color:#B5622A;line-height:1.7;margin-bottom:10px}
.log-row{display:flex;justify-content:space-between;align-items:center;padding:10px 13px;border-radius:13px;background:#fff;border:1.5px solid #F0EBE3;margin-bottom:5px;box-shadow:0 1px 3px rgba(0,0,0,.03)}
.x-btn{background:none;border:none;color:#D0C8C0;font-size:18px;padding:2px 5px;cursor:pointer}
.x-btn:hover{color:#E79A7D}
.tab-bar{display:flex;border-radius:14px;overflow:hidden;border:1.5px solid #E8E0D8;margin-bottom:12px;background:#FAF8F4}
.tab-opt{flex:1;padding:10px 4px;border:none;background:transparent;color:#8E8A86;font-size:11px;cursor:pointer;font-weight:600;font-family:'Nunito',sans-serif;transition:all .15s}
.tab-opt.active{background:#fff;color:#3B3B3B;box-shadow:0 1px 4px rgba(0,0,0,.08)}
.log-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.log-card{padding:14px 8px;border-radius:16px;border:1.5px solid #F0EBE3;background:#fff;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;font-family:'Nunito',sans-serif;color:#5C4033;font-size:12px;font-weight:600;box-shadow:0 1px 4px rgba(0,0,0,.04);transition:all .15s}
.log-card:active{transform:scale(.96);background:#FAF8F4}
.log-card .ei{font-size:26px}
.rings{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin:10px 0 12px}
.ring{text-align:center;padding:10px 2px;border-radius:14px;background:#fff;border:1.5px solid #F0EBE3;box-shadow:0 1px 3px rgba(0,0,0,.03)}
.rv{font-size:18px;font-weight:700;color:#3B3B3B;font-family:'Nunito',sans-serif}
.rl{font-size:8px;color:#8E8A86;text-transform:uppercase;margin-top:2px;font-weight:600}
.prim-btn{padding:13px;border-radius:14px;border:none;background:linear-gradient(135deg,#A8C5A1,#7DAE76);color:#fff;font-size:14px;font-weight:700;width:100%;cursor:pointer;font-family:'Nunito',sans-serif;box-shadow:0 3px 10px rgba(125,174,118,.3)}
.prim-btn:active{opacity:.9}
.acc-wrap{border-radius:14px;border:1.5px solid #F0EBE3;overflow:hidden;margin-bottom:8px;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.03)}
.acc-head{padding:13px 15px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;background:#fff;transition:background .15s}
.acc-head.open{background:#FAF8F4}
.acc-body{padding:0 15px 13px;display:none;font-size:12px;color:#6B6560;line-height:1.7;background:#FAF8F4}
.acc-body.open{display:block}
.chev{color:#B8AFA8;font-size:12px;transition:transform .2s}
.chev.open{transform:rotate(180deg)}
.cl-row{display:flex;align-items:flex-start;gap:10px;padding:9px 0;border-bottom:1.5px solid #F5F1EC}
.cl-row:last-child{border-bottom:none}
.cl-check{width:20px;height:20px;border-radius:6px;border:2px solid #D0C8C0;background:#fff;flex-shrink:0;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:11px;color:#fff;margin-top:1px;transition:all .15s}
.cl-check.done{background:#A8C5A1;border-color:#A8C5A1}
.chip-tag{display:inline-flex;padding:5px 11px;border-radius:20px;font-size:11px;margin:3px;border:1.5px solid #E8E0D8;background:#FAF8F4;color:#6B6560;cursor:pointer;font-weight:500;transition:all .15s}
.chip-tag.on{background:#F0F7EF;border-color:#A8C5A1;color:#5A7A55;font-weight:600}
.chip-tag.done{background:#F0F7EF;border-color:#A8C5A1;color:#5A7A55}

/* ── HERO CARDS ── */
.ww-hero{padding:16px;border-radius:18px;background:linear-gradient(135deg,#F0F7EF,#E8F4E7);border:1.5px solid #C8DEC5;margin-bottom:12px;position:relative;overflow:hidden}
.ww-hero::after{content:'🐛';position:absolute;right:14px;top:50%;transform:translateY(-50%);font-size:40px;opacity:.15;pointer-events:none}
.since-row{display:flex;gap:7px;margin-bottom:10px}
.since-chip{display:flex;flex-direction:column;align-items:center;padding:11px 6px;border-radius:14px;background:#fff;border:1.5px solid #F0EBE3;flex:1;cursor:pointer;box-shadow:0 1px 4px rgba(0,0,0,.04);transition:all .15s}
.since-chip.urgent{border-color:#F4C7C2;background:#FFF5F3}
.since-chip.late{border-color:#F4D4A8;background:#FFFAF3}
.since-chip.ok{border-color:#C8DEC5;background:#F0F7EF}
.tl{position:relative}
.tl-line{position:absolute;left:19px;top:0;bottom:0;width:2px;background:linear-gradient(180deg,#A8C5A1,#F4C7C2)}
.tl-row{display:flex;align-items:flex-start;margin-bottom:6px}
.tl-dot-wrap{width:40px;flex-shrink:0;display:flex;justify-content:center}
.tl-dot{width:13px;height:13px;border-radius:50%;margin-top:13px;z-index:1;flex-shrink:0;box-shadow:0 0 0 3px #FAF8F4}
.tl-card{flex:1;padding:11px 13px;border-radius:13px;cursor:pointer;border:1.5px solid #F0EBE3;border-left-width:3px;background:#fff;transition:all .15s;box-shadow:0 1px 3px rgba(0,0,0,.03)}
.tl-label{font-family:'Nunito',sans-serif;font-size:13px;color:#3B3B3B;font-weight:700}
.tl-time{font-size:10px;color:#8E8A86;margin-top:1px}
.tl-detail{font-size:11px;color:#6B6560;line-height:1.6;display:none;margin-top:6px}
.tl-detail.open{display:block}
.wk-hero{padding:18px;border-radius:18px;background:linear-gradient(135deg,#F5F0FF,#EDE4FA);border:1.5px solid #D9C6E6;margin-bottom:12px}
.size-big{font-size:56px;text-align:center;margin:8px 0;line-height:1}
.prog-bar{height:6px;border-radius:3px;background:#E8E0D8;overflow:hidden;margin:10px 0 4px}
.prog-fill{height:100%;border-radius:3px;background:linear-gradient(90deg,#D9C6E6,#E79A7D);transition:width .8s}
.cy-hero{padding:16px;border-radius:18px;background:linear-gradient(135deg,#FFF5F3,#FFF8F0);border:1.5px solid #F4C7C2;margin-bottom:12px}
.cycle-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin-bottom:8px}
.cy-day{aspect-ratio:1;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:600;background:#FAF8F4;color:#B8AFA8;border:1px solid #F0EBE3;font-family:'Nunito',sans-serif}
.cy-day.today{border-color:#A8C5A1;color:#5A7A55;background:#F0F7EF}
.cy-day.period{background:#FFF0EE;border-color:#F4C7C2;color:#C4614A}
.cy-day.fertile{background:#F0F7EF;border-color:#A8C5A1;color:#5A7A55}
.cy-day.ov{background:#FFF8E8;border-color:#E8C878;color:#A07820}
.sf-card{border-radius:14px;border:1.5px solid #F0EBE3;overflow:hidden;margin-bottom:8px;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.04)}
.sf-head{padding:13px 15px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;background:#fff;transition:background .15s}
.sf-head.open{background:#F4FAF3}
.sf-body{padding:0 15px 13px;display:none;font-size:11px;color:#6B6560;line-height:1.7;background:#F4FAF3}
.sf-body.open{display:block}
.prep-row{display:flex;gap:8px;padding:5px 0;border-bottom:1px solid #EFF5EE}
.prep-row:last-child{border-bottom:none}
.prep-num{width:19px;height:19px;border-radius:6px;background:#A8C5A1;color:#fff;font-size:9px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:2px}
.dose-box{padding:14px 16px;border-radius:16px;background:#F5F0FF;border:1.5px solid #D9C6E6;margin-bottom:12px}
.dose-result{padding:12px 14px;border-radius:12px;background:#fff;border:1.5px solid #D9C6E6;margin-top:10px}
.dose-amount{font-size:26px;font-weight:800;color:#7A5CA8;font-family:'Nunito',sans-serif}

/* ── MODAL ── */
#modal-overlay{position:fixed;inset:0;background:rgba(59,42,28,.5);z-index:300;display:none;align-items:flex-end;justify-content:center;backdrop-filter:blur(4px)}
#modal-overlay.open{display:flex}
#modal-box{background:#fff;border-radius:24px 24px 0 0;padding:22px 22px 48px;width:100%;max-width:480px;border-top:1.5px solid #F0EBE3;max-height:88vh;overflow-y:auto;box-shadow:0 -4px 24px rgba(0,0,0,.12)}
#modal-title{font-family:'Nunito',sans-serif;font-size:20px;font-weight:800;color:#3B3B3B;margin-bottom:16px}
.field{margin-bottom:11px}
.field label{font-size:11px;color:#8E8A86;display:block;margin-bottom:4px;text-transform:uppercase;letter-spacing:.07em;font-weight:600}
.field input,.field select,.field textarea{width:100%;padding:10px 13px;border-radius:12px;font-size:14px}
.field textarea{resize:vertical;min-height:52px}
.modal-btns{display:flex;gap:8px;margin-top:16px}
.btn-primary{flex:1;padding:13px;border-radius:14px;border:none;background:linear-gradient(135deg,#A8C5A1,#7DAE76);color:#fff;font-size:14px;font-weight:700;cursor:pointer;font-family:'Nunito',sans-serif;box-shadow:0 3px 10px rgba(125,174,118,.3)}
.btn-cancel{padding:13px 18px;border-radius:14px;border:1.5px solid #E8E0D8;background:#FAF8F4;color:#8E8A86;font-size:14px;cursor:pointer;font-family:'Nunito',sans-serif;font-weight:600}

/* ── CHAT ── */
.chat-wrap{display:flex;flex-direction:column;height:calc(100vh - 200px);min-height:340px}
.chat-msgs{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:9px;padding-bottom:10px;scrollbar-width:none}
.chat-msgs::-webkit-scrollbar{display:none}
.chat-msg{max-width:86%;padding:11px 14px;border-radius:18px;font-size:13px;line-height:1.6}
.chat-msg.user{align-self:flex-end;background:linear-gradient(135deg,#A8C5A1,#7DAE76);color:#fff;border-radius:18px 18px 4px 18px;box-shadow:0 2px 8px rgba(125,174,118,.3)}
.chat-msg.bot{align-self:flex-start;background:#fff;border:1.5px solid #F0EBE3;color:#3B3B3B;border-radius:18px 18px 18px 4px;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.chat-msg.bot strong{color:#3B3B3B}
.typing span{display:inline-block;animation:blink 1.4s infinite;color:#B8AFA8}
.typing span:nth-child(2){animation-delay:.2s}
.typing span:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:0}40%{opacity:1}}
.sq-list{display:flex;flex-wrap:wrap;gap:6px;padding:5px 0;flex-shrink:0}
.sq-btn{padding:7px 13px;border-radius:20px;border:1.5px solid #C8DEC5;background:#F0F7EF;color:#5A7A55;font-size:11px;cursor:pointer;font-family:'Nunito',sans-serif;font-weight:600}
.sq-btn:active{background:#E0EFE0}
.chat-input-row{display:flex;gap:8px;align-items:flex-end;padding-top:10px;border-top:1.5px solid #F0EBE3;flex-shrink:0}
.chat-input{flex:1;padding:10px 14px;border-radius:16px;font-size:13px;resize:none;min-height:42px;max-height:90px;line-height:1.4;background:#FAF8F4;border:1.5px solid #E8E0D8;color:#3B3B3B}
.chat-input:focus{border-color:#A8C5A1}
.chat-go{width:42px;height:42px;border-radius:14px;border:none;background:linear-gradient(135deg,#A8C5A1,#7DAE76);color:#fff;font-size:18px;flex-shrink:0;cursor:pointer;box-shadow:0 2px 8px rgba(125,174,118,.3)}
.chat-go:disabled{opacity:.4}

/* ── BIRTH PLAN ── */
.bp-section{background:#fff;border-radius:14px;border:1.5px solid #F0EBE3;padding:13px 15px;margin-bottom:9px;box-shadow:0 1px 3px rgba(0,0,0,.03)}
.bp-q{font-family:'Nunito',sans-serif;font-size:13px;color:#3B3B3B;font-weight:700;margin-bottom:8px}
.bp-opts{display:flex;flex-wrap:wrap;gap:6px}
.bp-opt{padding:6px 13px;border-radius:20px;font-size:11px;border:1.5px solid #E8E0D8;background:#FAF8F4;color:#6B6560;cursor:pointer;font-family:'Nunito',sans-serif;font-weight:600;transition:all .15s}
.bp-opt.sel{background:#F0F7EF;border-color:#A8C5A1;color:#5A7A55}

/* ── PHOTOS ── */
.photo-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px}
.photo-cell{border-radius:14px;overflow:hidden;border:1.5px solid #F0EBE3;aspect-ratio:1;background:#FAF8F4;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;transition:all .15s}
.photo-cell img{width:100%;height:100%;object-fit:cover}
.photo-cell.empty{border-style:dashed;border-color:#D0C8C0}
.photo-cell.locked{opacity:.35}

/* ── PROGRESS BAR (inline) ── */
.mini-prog{height:5px;border-radius:3px;background:#F0EBE3;overflow:hidden;margin-top:6px}
.mini-prog-fill{height:100%;border-radius:3px;background:#A8C5A1;transition:width .5s}
</style>
</head>
<body>

<!-- LANDING -->
<div id="screen-landing">
  <div class="land-logo-wrap">
    <img src="logo.png" alt="LittleBug" style="width:160px;height:auto;display:block;margin:0 auto"
      onerror="this.style.display='none';document.getElementById('fallback-logo').style.display='block'">
    <svg id="fallback-logo" style="display:none" width="110" height="120" viewBox="0 0 110 120" xmlns="http://www.w3.org/2000/svg">
      <path d="M45 30 Q38 16 31 10" stroke="#5C3D2E" stroke-width="2.5" fill="none" stroke-linecap="round"/>
      <path d="M65 30 Q72 16 79 10" stroke="#5C3D2E" stroke-width="2.5" fill="none" stroke-linecap="round"/>
      <circle cx="30" cy="9" r="3.5" fill="#5C3D2E"/>
      <circle cx="80" cy="9" r="3.5" fill="#5C3D2E"/>
      <ellipse cx="55" cy="34" rx="13" ry="11" fill="#5C3D2E"/>

let S={mode:'',tab:'',babyName:'',babyAge:2,unit:'oz',logs:[],foods:[],health:{temps:[],meds:[],vaccs:[],visits:[],moods:[]},ms:{},growth:[],wtKg:null,ttMins:0,wtSets:{L:0,R:0},ttcName:'',pregName:'',pregDue:'',pregWeek:20,cycleLen:28,periodLen:5,periods:[],bbt:[],lh:[],symptoms:[],preconCheck:{},trimCheck:{},pregSymptoms:[],pregWeight:[],appts:[],kicks:[],contractions:[],birthPlan:{},hospitalBag:{},nurseryCheck:{},newbornCheck:{},photos:{},exp:null,mType:null,devTab:'activities',fsTab:'milk',solidIdx:null,newbornTab:'checklist',nurseryTab:'hospital',ppTab:'recovery',babyBirthday:null};
function sv(){try{localStorage.setItem('littlebug1',JSON.stringify(S));}catch(e){}}
function ld(){try{const d=JSON.parse(localStorage.getItem('littlebug1')||localStorage.getItem('lb7')||'{}');Object.keys(d).forEach(k=>{if(k in S)S[k]=d[k];});['temps','meds','vaccs','visits','moods'].forEach(k=>{if(!Array.isArray(S.health[k]))S.health[k]=[];});}catch(e){}}
function uid(){return Math.random().toString(36).slice(2,8)}
function nw(){return new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}
function tod(){return new Date().toLocaleDateString([],{month:'short',day:'numeric'})}
function fv(ml){return S.unit==='oz'?+(ml/29.5735).toFixed(1)+'oz':ml+'ml'}
function ozToMl(o){return Math.round(o*29.5735)}
function lbKg(lb,oz){return((lb||0)*.453592)+((oz||0)*.0283495)}
function kgLb(kg){const t=kg/.453592;const lb=Math.floor(t);return{lb,oz:Math.round((t-lb)*16)}}
function fwt(kg){if(!kg)return'—';const{lb,oz}=kgLb(kg);return`${lb}lb ${oz}oz`}
function since(t){if(!t)return null;const now=Date.now();const p=t.split(':');let d=new Date();d.setHours(+p[0],+p[1],0);if(d>now)d.setDate(d.getDate()-1);const m=Math.floor((now-d)/60000);return{total:m,s:m<60?m+'m ago':Math.floor(m/60)+'h '+(m%60)+'m ago'}}
function lastOf(t){return(S.logs.find(l=>l.type===t)||{}).time||null}
function tog(k){S.exp=S.exp===k?null:k;ra()}
function shd(t){return`<div class="section-hd">${t}</div>`}
function calcBabyAge(){if(!S.babyBirthday)return S.babyAge||0;const birth=new Date(S.babyBirthday);const now=new Date();let m=(now.getFullYear()-birth.getFullYear())*12+(now.getMonth()-birth.getMonth());if(now.getDate()<birth.getDate())m--;return Math.max(0,Math.min(12,m));}
function getBabyAgeDisplay(){if(!S.babyBirthday)return ALF[S.babyAge]||'?';const birth=new Date(S.babyBirthday);const days=Math.floor((Date.now()-birth)/86400000);if(days===0)return'Born today! 🎉';if(days<7)return days+' day'+(days===1?'':'s')+' old';if(days<30){const w=Math.floor(days/7);return w+' week'+(w===1?'':'s')+' old';}const mo=calcBabyAge();return ALF[mo]||'?';}
function cycleDay(){if(!S.periods.length)return null;const last=S.periods[S.periods.length-1];const d=new Date(last.iso||new Date());const diff=Math.floor((Date.now()-d)/86400000)+1;return diff>0&&diff<=60?diff:null;}
function ovDay(){return Math.round(S.cycleLen-14)}
function nextP(){if(!S.periods.length)return'—';const d=new Date((S.periods[S.periods.length-1].iso||new Date()));return new Date(d.getTime()+S.cycleLen*86400000).toLocaleDateString([],{month:'short',day:'numeric'});}
function calcW(){if(!S.pregDue)return S.pregWeek||20;const due=new Date(S.pregDue);const w=Math.floor((Date.now()-new Date(due.getTime()-280*86400000))/604800000);return Math.max(1,Math.min(42,w));}
function trimOf(w){return w<=13?'1st Tri':w<=26?'2nd Tri':'3rd Tri'}
function daysL(){if(!S.pregDue)return'—';const d=Math.ceil((new Date(S.pregDue)-Date.now())/86400000);return d>0?d+'d':d===0?'Today!':'Born!';}

// ── MODE ──
function setMode(m){
  S.mode=m;S.tab=MODE_TABS[m][0];
  if(m==='baby'&&!S.babyBirthday){S.babyBirthday=new Date().toISOString().slice(0,10);S.babyAge=0;}
  document.getElementById('screen-landing').classList.add('hidden');
  document.getElementById('screen-app').classList.add('on');
  sv();ra();
}
function switchMode(){
  document.getElementById('screen-landing').classList.remove('hidden');
  document.getElementById('screen-app').classList.remove('on');
}

// ── RENDER ──
function ra(){rHdr();rNav();rContent();}
function rHdr(){
  const pp=document.getElementById('mode-pill');
  if(pp){pp.textContent={ttc:'🌱 TTC',preg:'🌿 Pregnant',baby:'🐞 Baby'}[S.mode]||'🐞 Baby';pp.className='mode-pill '+(S.mode||'baby');}
  const sb=document.getElementById('stats-bar');if(!sb)return;
  let stats=[];
  if(S.mode==='ttc')stats=[{l:'Cycle Day',v:cycleDay()||'—'},{l:'Cycle',v:S.cycleLen+'d'},{l:'Ovulation',v:'Day '+ovDay()},{l:'Next Period',v:nextP()}];
  else if(S.mode==='preg'){const w=calcW();stats=[{l:'Week',v:w},{l:'Trimester',v:trimOf(w)},{l:'Days Left',v:daysL()},{l:'Due',v:S.pregDue||'Not set'}];}
  else{if(S.babyBirthday)S.babyAge=calcBabyAge();const d=getAD(S.babyAge);stats=[{l:'Age',v:getBabyAgeDisplay()},{l:'Wake Win',v:d.ww},{l:'Naps',v:d.naps},{l:'Bedtime',v:d.bt}];}
  sb.innerHTML=stats.map((s,i)=>`<div class="stat"${i===stats.length-1?' style="border-right:none"':''}><div class="sv">${s.v}</div><div class="sl">${s.l}</div></div>`).join('');
}
function rNav(){
  const items=NAV_ITEMS[S.mode]||NAV_ITEMS.baby;
  const tabs=MODE_TABS[S.mode]||[];
  const nav=document.getElementById('bottom-nav');
  nav.innerHTML=items.map(item=>`<button class="bnav-btn${S.tab===item.tab?' active':''}" data-tab="${item.tab}"><span class="bnav-icon">${item.icon}</span><span class="bnav-label">${item.label}</span></button>`).join('');
  nav.querySelectorAll('.bnav-btn').forEach(btn=>btn.addEventListener('click',function(){S.tab=this.dataset.tab;S.exp=null;ra();}));
  const content=document.getElementById('content');
  content.innerHTML=tabs.map(t=>`<div id="p-${t}" class="page${S.tab===t?' active':''}"></div>`).join('');
  // Render content AFTER DOM is built
  rContent();
}

async function sendChat(){
  const mode=S.mode;const input=document.getElementById('chat-input');const btn=document.getElementById('chat-go');
  const q=(input?.value||'').trim();if(!q)return;
  CH[mode]=CH[mode]||[];CH[mode].push({role:'user',content:q});

  let ctx='';
  if(mode==='ttc')ctx=`User is TTC. Cycle: ${S.cycleLen}d. Periods logged: ${S.periods.length}. Name: ${S.ttcName||'not set'}.`;
  else if(mode==='preg'){const w=calcW();ctx=`Pregnant. Week: ${w}. Due: ${S.pregDue||'not set'}. Trimester: ${trimOf(w)}.`;}
  else{const d=getAD(S.babyAge);const tl=S.logs.filter(l=>l.date===tod());ctx=`Baby age: ${ALF[S.babyAge]}. Name: ${S.babyName||'not set'}. Wake window: ${d.ww}. Feeds today: ${tl.filter(l=>l.type==='feed').length}.`;}
  const sys=`You are LittleBug, a warm, evidence-based ${mode==='ttc'?'TTC/fertility':mode==='preg'?'pregnancy':'baby care'} assistant built into the LittleBug app. Context: ${ctx} Keep responses to 2–3 short paragraphs. Use **bold** for key terms. Never diagnose. For medical concerns, recommend consulting a provider.`;
  try{
    const res=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json','x-api-key':'YOUR_API_KEY_HERE','anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:800,system:sys,messages:CH[mode].map(m=>({role:m.role==='user'?'user':'assistant',content:m.content}))})});
    const data=await res.json();const reply=(data.content?.[0]?.text||'Trouble connecting. Please try again.').replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>').replace(/\n\n/g,'<br><br>').replace(/\n[-•]/g,'<br>•');
    CH[mode].push({role:'assistant',content:reply});
  }catch(e){CH[mode].push({role:'assistant',content:'Sorry, couldn\'t connect. Please try again. 🐞'});}
  const msgs2=document.getElementById('chat-msgs');if(msgs2){msgs2.innerHTML=CH[mode].map(m=>`<div class="chat-msg ${m.role==='user'?'user':'bot'}">${m.content}</div>`).join('');msgs2.scrollTop=msgs2.scrollHeight;}

    MONTHS.forEach(mo=>{
      const photo=S.photos[mo.m];
      if(photo){h+=`<div style="position:relative" data-view="${mo.m}"><div style="aspect-ratio:1;border-radius:14px;overflow:hidden;border:2px solid #C8DEC5;cursor:pointer"><img src="${photo}" style="width:100%;height:100%;object-fit:cover" alt="${mo.l}"></div><div style="font-family:'Nunito',sans-serif;font-size:9px;color:#5A7A55;text-align:center;margin-top:4px;font-weight:700">${mo.l}</div></div>`;}
      else if(mo.m<=currentAge+1){h+=`<div style="aspect-ratio:1;border-radius:14px;border:2px dashed #D0C8C0;background:#FAF8F4;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer" data-add="${mo.m}"><div style="font-size:18px;color:#D0C8C0">+</div><div style="font-size:9px;color:#D0C8C0;margin-top:2px;font-weight:600">${mo.l}</div></div>`;}
      else{h+=`<div style="aspect-ratio:1;border-radius:14px;border:1.5px solid #F0EBE3;background:#FAF8F4;display:flex;flex-direction:column;align-items:center;justify-content:center;opacity:.3"><div style="font-size:16px">🔒</div><div style="font-size:9px;color:#B8AFA8;margin-top:2px">${mo.l}</div></div>`;}
    });
    h+=`</div>`;
  }
  h+=shd('All Months');
  MONTHS.forEach(mo=>{
    const photo=S.photos[mo.m];const unlocked=mo.m<=currentAge+1;
    h+=`<div style="display:flex;align-items:center;gap:13px;padding:12px 14px;border-radius:16px;background:#fff;border:1.5px solid ${photo?'#C8DEC5':'#F0EBE3'};margin-bottom:7px;${!unlocked?'opacity:.4':''}box-shadow:0 1px 4px rgba(0,0,0,.04)">
      <div style="width:54px;height:54px;border-radius:12px;overflow:hidden;flex-shrink:0;background:#FAF8F4;border:1.5px solid #F0EBE3;display:flex;align-items:center;justify-content:center">${photo?`<img src="${photo}" style="width:100%;height:100%;object-fit:cover">`:`<span style="font-size:24px">${mo.m===0?'🌱':mo.m===6?'🌿':mo.m===12?'🎂':'📷'}</span>`}</div>
      <div style="flex:1"><div style="font-family:'Nunito',sans-serif;font-size:14px;font-weight:700;color:#3B3B3B">${mo.l}</div><div style="font-size:11px;color:#8E8A86;margin-top:2px;line-height:1.4">${photo?'✓ Photo added':mo.prompt}</div></div>
      ${unlocked?`<div style="display:flex;flex-direction:column;gap:5px;flex-shrink:0">
        <label style="padding:7px 12px;border-radius:10px;border:1.5px solid #C8DEC5;background:#F0F7EF;color:#5A7A55;font-size:11px;font-weight:600;cursor:pointer;text-align:center;white-space:nowrap">${photo?'Change':'+ Add'}
          <input type="file" accept="image/*" data-month="${mo.m}" style="display:none" capture="environment">
        </label>
        ${photo?`<button data-del-photo="${mo.m}" style="padding:5px 9px;border-radius:8px;border:1.5px solid #F4C7C2;background:#FFF5F3;color:#C4614A;font-size:10px;font-weight:600;cursor:pointer">Remove</button>`:''}
      </div>`:`<div style="font-size:11px;color:#D0C8C0;font-weight:600">Not yet</div>`}
    </div>`;
  });
  el.innerHTML=h;
  el.querySelectorAll('input[type=file]').forEach(input=>{
    input.addEventListener('change',function(){
      const month=+this.dataset.month;const file=this.files[0];if(!file)return;
      const reader=new FileReader();
      reader.onload=e=>{if(!S.photos)S.photos={};S.photos[month]=e.target.result;sv();rPhotos();};
      reader.readAsDataURL(file);
    });
  });
  el.querySelectorAll('[data-del-photo]').forEach(btn=>btn.addEventListener('click',function(){delete S.photos[+this.dataset.delPhoto];sv();rPhotos();}));
  el.querySelectorAll('[data-view]').forEach(btn=>btn.addEventListener('click',function(){
    const month=+this.dataset.view;const photo=S.photos[month];const mo=MONTHS.find(m=>m.m===month);
    if(!photo)return;
    const overlay=document.createElement('div');
    overlay.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:500;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px';
    overlay.innerHTML=`<img src="${photo}" style="max-width:100%;max-height:80vh;border-radius:20px;object-fit:contain"><div style="font-family:Nunito,sans-serif;font-size:18px;font-weight:800;color:#fff;margin-top:16px">${mo?.l||''}</div><button style="margin-top:16px;padding:11px 28px;border-radius:14px;border:none;background:rgba(255,255,255,.15);color:#fff;font-size:14px;cursor:pointer;font-weight:600">Close</button>`;
    overlay.querySelector('button').addEventListener('click',()=>overlay.remove());
    overlay.addEventListener('click',function(e){if(e.target===this)this.remove();});
    document.body.appendChild(overlay);
  }));
}

// ── INIT ──
ld();
if(S.mode){
  document.getElementById('screen-landing').classList.add('hidden');
  document.getElementById('screen-app').classList.add('on');
  ra();
}
document.getElementById('modal-cancel').onclick=closeM;
document.getElementById('modal-save').onclick=saveM;
document.getElementById('modal-overlay').onclick=function(e){if(e.target===this)closeM();};
document.getElementById('settings-btn').onclick=function(){openM('settings');};
document.getElementById('mode-pill').onclick=switchMode;
</script>
</body>
</html>
